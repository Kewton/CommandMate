<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>demo-video telop</title>
    <!--
      Full-frame transparent overlay: the band is already positioned here, so
      ffmpeg composites it at 0:0 and never has to know about layout. Rendered
      with Playwright's `omitBackground: true`.

      Every font is a system font. The page must render identically with no
      network at all — a webfont request would silently fall back mid-take and
      change the line width between the ja and en passes.
    -->
    <style>
      :root {
        --band-bg: rgba(12, 16, 22, 0.82);
        --band-fg: #f5f7fa;
        --band-accent: #22d3ee;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      #telop-band {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        max-width: 84%;
        margin-bottom: 7.5%;
        padding: 20px 40px;
        border-radius: 14px;
        background: var(--band-bg);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(2px);
      }
      #telop-band::before {
        content: '';
        flex: 0 0 auto;
        width: 6px;
        align-self: stretch;
        border-radius: 3px;
        background: var(--band-accent);
      }
      #telop-text {
        color: var(--band-fg);
        font-family: 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans',
          'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <!-- Text is injected with `element.textContent` by render-overlays.ts, never
         by string concatenation, so storyboard wording cannot inject markup. -->
    <div id="telop-band"><span id="telop-text"></span></div>
  </body>
</html>
