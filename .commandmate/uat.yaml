# .commandmate/uat.yaml — v1
#
# How to stand CommandMate itself up for a real-environment UAT, read by the
# official cmate-uat Skill (Kewton/commandmate-skills, 0.1.0+). The contract is
# skills/cmate-uat/references/uat-yaml-contract.md in that repository.
#
# This is the declarative form of what .claude/commands/uat.md and the recent
# dev-reports/issue/<n>/uat/ runs did by hand (Issue #2590). Placeholders:
# {port} {run_dir} {target}. `{pid}` is deliberately not used: the server is
# started in the background, so every check finds it by its LISTENING port.
#
# Starting and stopping live in scripts/uat/run-server.sh (Issue #3359), which
# the daily check (#3312) shares. `up` and `down` only call it. It holds:
#
#   - ISOLATION. A UAT server started from a worktree has grabbed the production
#     DB before, because settings resolution fell through to production. "It
#     listens on another port" proves nothing. So `env -i` starts the server
#     with no inherited variable and CM_DB_PATH / CM_ROOT_DIR /
#     CM_OPENCODE_V2_DIR / CM_AGENT_HOOKS_DIR are set under {run_dir}, with
#     CM_UAT_ISOLATION=1 (Issue #3360, docs/user-guide/uat-isolation.md) so the
#     build writes none of the agents' shared hook files, grants no codex hook
#     trust and reads no user-level claude settings. TMUX
#     names a PRIVATE tmux server on /tmp/cmuat-{port}-<run id>/tmux.sock (the
#     technique tests/unit/config/tmux-live-test-safety.test.ts prescribes),
#     started first from the caller's normal environment, because a tmux server
#     born under `env -i` loses Keychain access and a claude session in it
#     comes up logged out. Every tmux command names its socket with -S.
#   - OWNERSHIP. Each run has its own id, so two runs on the same port never
#     share a socket. `up` writes {run_dir}/uat-run.state (run id, socket dir,
#     server pid, and CM_DB_PATH as read off that pid's own environment).
#     `down` stops the recorded pid only when it is the one LISTENING on
#     {port} and its CM_DB_PATH is under {run_dir}; otherwise it stops nothing
#     and fails. It never kills by port alone, so another owner of {port} (a
#     second UAT, anything else) is left running.
#   - ONE RUN AT A TIME. A `mkdir` lock (scripts/uat/run-lock.sh) shared with
#     the daily check and `run.ts` is taken before `up` starts anything and
#     released by `down` once the server is gone. The next `up` cleans what a
#     killed run left behind, with the same checks.
#   - codex's two shared files are hashed in `up` and compared in `down`,
#     against ONE absolute CODEX_HOME that `up` decides (the caller's, else
#     $HOME/.codex) and also hands to the server and the private tmux server;
#     so is antigravity's ~/.gemini/config/hooks.json (#3360). This is the
#     check on CM_UAT_ISOLATION=1.
#     A value the server would refuse (/proc, /sys, /dev) or an explicit one
#     that is not a directory stops `up` before anything starts (#3358).
#
# isolation.checks measures it on the running process, positive and negative,
# before any test case runs. Each check fails when pointed at a server that is
# not isolated (measured against the production :3000).
version: 1
env:
  build: "npm run build:all"
  # The shell that used to stand here (env -i with CM_UAT_ISOLATION=1, the
  # private tmux server, the shared-file hashes) moved verbatim into
  # scripts/uat/run-server.sh.
  # tests/unit/config/uat-yaml-2590.test.ts holds the server line's shape there.
  up: "bash scripts/uat/run-server.sh up --port {port} --run-dir {run_dir}"
  # The CLI for this run (Issue #3360) — the SAME build's CLI by absolute path,
  # never the global `commandmate`; its own empty HOME, so neither
  # ~/.commandmate/.env nor ~/.commandmate-security.log is touched; CM_PORT
  # exported, and CM_UAT_ISOLATION=1 so that it reads no .env and exits 2
  # instead of falling back to 3000 (production) when CM_PORT is missing:
  #
  #   mkdir -p {run_dir}/client-home
  #   env -i HOME={run_dir}/client-home PATH="$PATH" CM_UAT_ISOLATION=1 \
  #     CM_PORT={port} CM_BIND=127.0.0.1 node "$PWD/bin/commandmate.js" ls --json
  #
  # Stops only the recorded server, after checking it LISTENS on {port} and its
  # CM_DB_PATH is under {run_dir} (CommandMate#2473, #3359); fails otherwise.
  # Also removes the private tmux server and fails when codex's shared files or
  # antigravity's ~/.gemini/config/hooks.json changed during the run.
  down: "bash scripts/uat/run-server.sh down --run-dir {run_dir}"
  health: "curl -fsS -m 5 -o /dev/null http://127.0.0.1:{port}/api/worktrees"
  health_timeout_sec: 90
  port_range: [3010, 3030]
isolation:
  checks:
    # The listener opened the run's own DB (positive).
    - "P=$(lsof -nP -iTCP:{port} -sTCP:LISTEN -t | head -1); lsof -p $P -Fn | grep -qxF 'n{run_dir}/uat.db'"
    # It opened NO other sqlite file (negative) — production is
    # <checkout>/data/db.sqlite or ~/.../.commandmate/data/cm.db, and neither may appear.
    - "P=$(lsof -nP -iTCP:{port} -sTCP:LISTEN -t | head -1); ! lsof -p $P -Fn | sed -n 's/^n//p' | grep -E '\\.(db|sqlite)(-wal|-shm)?$' | grep -vF '{run_dir}/uat.db'"
    # Its tmux calls go to the private server: TMUX names this run's own socket
    # (recorded by `up`), which is under /tmp/cmuat-{port}-<run id>/.
    - "P=$(lsof -nP -iTCP:{port} -sTCP:LISTEN -t | head -1); S=$(sed -n 's/^sock_dir=//p' {run_dir}/uat-run.state); case \"$S\" in /tmp/cmuat-{port}-?*) ;; *) exit 1 ;; esac; ps eww -p $P | tr ' ' '\\n' | grep -qF \"TMUX=$S/tmux.sock,\""
    # The listener is the pid `up` recorded (a server on {port} that is not
    # this run's would otherwise pass every check above).
    - "P=$(lsof -nP -iTCP:{port} -sTCP:LISTEN -t | head -1); [ -n \"$P\" ] && [ \"$P\" = \"$(sed -n 's/^server_pid=//p' {run_dir}/uat-run.state)\" ]"
    # The two shared state directories live under the run (positive) and the
    # server was not left pointing at the user's ~/.commandmate ones (negative).
    - "P=$(lsof -nP -iTCP:{port} -sTCP:LISTEN -t | head -1); ps eww -p $P | tr ' ' '\\n' | grep -qxF 'CM_OPENCODE_V2_DIR={run_dir}/opencode-v2' && ps eww -p $P | tr ' ' '\\n' | grep -qxF 'CM_AGENT_HOOKS_DIR={run_dir}/hooks'"
    - "P=$(lsof -nP -iTCP:{port} -sTCP:LISTEN -t | head -1); ! ps eww -p $P | tr ' ' '\\n' | grep -E '^CM_(OPENCODE_V2|AGENT_HOOKS)_DIR=' | grep -vF '{run_dir}/'"
    # It runs in UAT isolation (Issue #3360): no shared codex / antigravity
    # write, no codex hook trust grant, no user-level claude settings.
    - "P=$(lsof -nP -iTCP:{port} -sTCP:LISTEN -t | head -1); ps eww -p $P | tr ' ' '\\n' | grep -qxF 'CM_UAT_ISOLATION=1'"
    # The API sees only the sandbox root: every registered repository lives under {run_dir}/root.
    - "curl -fsS -m 5 http://127.0.0.1:{port}/api/repositories | python3 -c \"import json,sys; d=json.load(sys.stdin); r=d if isinstance(d,list) else d.get('repositories',[]); sys.exit(0 if all(str(x.get('path','')).startswith('{run_dir}/root') for x in r) else 1)\""
report_dir: ".commandmate/uat"
