    - "src/lib/polling/response-checker.ts"
    - "tests/unit/lib/polling/response-checker-capture-window-saturation.test.ts"
    - "tests/unit/lib/polling/**"
    - "tests/unit/lib/detection/**"
    - "tests/fixtures/codex-live-2310/**"
    - "dev-reports/changelog/issue-2400.md"
    - "dev-reports/module-reference/issue-2400.md"
  deny:
    - "src/lib/hooks/stop-history-capture.ts"
    - "src/lib/hooks/agent-event-service.ts"
    - "src/lib/relay/relay-delivery.ts"
    - "src/lib/hooks/sources/codex/history.ts"
    - "tests/unit/lib/detection/fixtures/**"
