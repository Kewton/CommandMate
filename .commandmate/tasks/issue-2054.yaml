version: 1
title: 'Issue #2054: 構造化ソースの健全性をヘッダチップに出し probeActivity / liveness を配線する'
goal: "/pm-auto-issue2dev 2054\n\nIssue: https://github.com/Kewton/CommandMate/issues/2054\nEpic #2055 Phase 4。設計書の記録先は\n`docs/design/opencode-server-live-verification.md` の **`## 25. Issue 2054: …`**\n（§23 は並列で走る #2051、§24 は並列で走る #2052 が使う）。\n\n## オーケストレーターがコードで裏取りした事実（Issue 本文と食い違う点を含む）\n\n- **`structuredEvents.source` は既に存在します。** #1924 が `{cliToolId, capabilities}` を\n  載せており、型は `src/lib/session/current-output-builder.ts:407` の `StructuredSourcePayload`、\n  CLI 側の鏡は `src/cli/types/api-responses.ts:556`。\n  **新設ではなく拡張**です。既存の 2 フィールドを消さないこと。\n- **`probeActivity` / `liveness` に本番の呼び出し元が無いのは事実です。**\n  `.probeActivity(` / `.liveness(` を src 全体で検索して **0 件**（定義箇所を除く）。\n- **ただし `getOpencodeLiveness()` は既に 3 箇所から直接呼ばれています**:\n  `src/app/api/worktrees/[id]/instances/opencode/route.ts:89` / `src/lib/cli-tools/opencode.ts:599` /\n  `src/lib/hooks/sources/opencode/runtime.ts:265`。\n  **4 人目の直接の読み手を増やさないでください。** source I/F 経由に寄せるのか、\n  直接呼びのままにするのかを決めて、決めた理由を §25 に書くこと。\n- Issue 本文の `source.ts:361-362` は**行番号が陳腐化**しています。実際は\n  `src/lib/hooks/sources/opencode/source.ts:384-385`（`probeActivity: probeOpencodeActivity` /\n  `liveness: (target) => getOpencodeLiveness(target)`）で、**中身は既に実装済み**です。\n  足りないのは呼び出し元だけ。\n- `port_identity_changed` は `src/lib/hooks/sources/opencode/subscription.ts:705` / `:713` で\n  実際に `liveness = {state:'lost', reason:'port_identity_changed'}` として立っています。\n- `src/lib/session/worktree-status-helper.ts` に `liveness` / `degraded` の文字列は **0 件**。\n  Issue の「`liveness` を `worktree-status-helper` から読み」は**これから配線する**という意味です。\n\n## 実装内容\n\n- `structuredEvents.source` に `kind: 'sse' | 'hooks' | 'scraper'` / `degradedReason?` /\n  `liveness?: 'live' | 'stale'` を **additive** で足す。CLI 側（`api-responses.ts`）は\n  #1924 と同じ理由で**文字列型のまま**にすること（このコメントがファイルに書いてあります。\n  union に狭めると、新しい値を宣言した新しいサーバに対して古い CLI が parse 失敗になります）。\n- ヘッダチップの tooltip と `AgentInstancesPane` の警告行に表示。**pull 型 source ＝ opencode のみ描画。**\n- `liveness` を `worktree-status-helper` から読み、heartbeat 断（30 秒）を `stale` として表示。\n- `probeActivity` を再接続直後の活動再取得に接続する。\n\n## 触ってはいけないファイル（並列ワーカーの所有）\n\n並列で #2051 が走っており、**`src/lib/hooks/sources/opencode/client.ts` は #2051 の所有**です\n（末尾に share / unshare を追記します）。`OpencodeSessionControls.tsx` と\n`src/lib/daily-summary-generator.ts` も #2051 の所有です。触らないでください。\n\n## 受入条件\n\n- 隔離サーバで opencode の port を別プロセスに奪わせる → チップに `port_identity_changed` が出て、\n  状態が scraper 由来に切り替わる（**実測**。`subscription.ts:705` の経路が実際に通ることを確かめる）。\n- **claude / codex のヘッダ描画は不変**（スナップショット）。\n- `structuredEvents.source` の既存 2 フィールド（`cliToolId` / `capabilities`）が壊れていない\n  （`tests/unit/hooks/sources/capabilities.test.ts` の 6×5 pin は #2053 が後で触るので、\n  **あなたは capabilities の宣言値を変えないこと**）。\n\n## 実機計測の安全規則（厳守）\n\nこの Issue は opencode 1.18.22 の実機計測が受入条件です。**手順は\n`docs/design/opencode-server-live-verification.md` §4「再現環境（ハーネス）」に完全に文書化\nされているので、まずそれを読み、そのとおりに再現してください。** 自分で新しい隔離方法を発明しないこと。\n\n§4 が明記している、破ると実害が出る点:\n\n- **`HOME` ごと差し替える。** opencode は `$HOME` から config（`~/.config/opencode`）・\n  state・データ（`~/.local/share/opencode`、**`opencode.db` を含む**）を解決し、\n  セッションを 1 回動かすだけで `opencode.db` に書き込みます。\n  HOME を差し替えないと**ユーザーの実データを汚します**。\n- **隔離できていることを `GET /path` で確認する。** 返る `home` / `state` / `config` /\n  `worktree` / `directory` が**すべて scratchpad 配下**であることを目視ではなく実際に確認すること。\n- **TUI のモデルピッカーを開かない。** opencode はピッカーで**既定モデルを書き換えます**\n  （Claude の `/model` overlay と同じ罠）。§4 のとおり config でモデルを固定し、\n  ピッカーは一度も開かないこと。\n- **`auth.json` は mode 600 で複製し、検証後に削除する。**\n\n加えて tmux について:\n\n- **実 tmux を触る検証は必ず `tmux -L <専用socket>` で行う。** `-L` / `-S` は `$TMUX` より優先されます。\n  あなたは tmux ペインの中で動いていて `$TMUX` が既定サーバを指しているため、フラグ無しの\n  `tmux` 呼び出しは全て**ユーザーの本番サーバ**に届きます。\n- **`kill-server` を `-L` 無しで書かない。** 後始末は `kill-session -t '=<name>:'`（完全一致）で。\n- **`TMUX_TMPDIR` を隔離手段に使わない。** `$TMUX` が設定されていると完全に無視されます。\n- **`bind-key` / `unbind-key` / `set-option -g` を既定サーバへ撃たない。**\n\n**いま他に 2 つのワーカーが並列で走っています。**既定 tmux サーバを壊すと巻き添えになります。\n\n## 計測できなかった場合\n\n隔離ハーネスが立ち上がらない、opencode が期待どおり動かない等で計測できなかったら、\n**推測で埋めないでください。** 「計測できなかった」ことと理由を設計書と commit に書き、\nコード側は計測に依存しない範囲だけを実装してください。\n**推測値を実測として記録するのが、この Issue で最も避けたい失敗です。**\n\n## 作業ルール（厳守）\n\n- **Issue 本文を書き戻さないでください。** Issue の管理はオーケストレーターが行います。\n  本文とコード／実機が食い違ったら**実測を正**とし、差異は commit メッセージと docblock に残してください。\n- **PR を作らないでください。** commit までで止めてください。\n- 作業は **単一 commit** にまとめてください。\n- 新規テストファイルは `-2054` の接尾辞をつけてください。\n- **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。\n  代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には入りません。\n  - `dev-reports/changelog/issue-2054.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま\n    貼れる **1 エントリ**。どの節に入るかを 1 行目に HTML コメントで書く。\n    **形式は次の実例に合わせてください**（エントリは**ファイル中では 1 行**で、\n    下で折り返して見えるのは表示上の都合です）:\n\n    ```markdown\n    <!-- ### Fixed -->\n    - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた。\n    ```\n\n    - `- **` で始めること（集計は `grep -cE '^- \\*\\*'`）\n    - `(#2054)` は要約の**外**（`**` を閉じた後）に置くこと\n    - `<type>` は CLAUDE.md の規約語彙（`feat` / `fix` / `docs` / `refactor` / `test` / `chore` / `ci` / `style`）\n    - 1 エントリ＝1 行（折らない）\n  - `dev-reports/module-reference/issue-2054.md` — `docs/module-reference.md` の表に足す注記を\n    **行キー（`| \\`path\\` |`）ごと**に列挙する。**既存行に足すときは\n    `grep -n '^| \\`<path>\\`' docs/module-reference.md` を実行し、その出力（行番号つきの行キー）を\n    断片に書き写してから**書くこと。**0 件だった行への追記を指示しないでください**\n    （0 件なら「行が無いので追記指示は出さない」と書けばよい）。実例:\n\n    ```markdown\n    ## 既存行への追記\n    - `src/lib/foo/bar.ts` — 実在確認: `docs/module-reference.md:NNN`\n      追記内容: 「…（Issue #2054）」\n\n    ## 新規行\n    追記なし\n    ```\n- 断片が無いとリリースノートと module-reference に載りません。**実装と同じ commit の時点で書くこと。**\n- 完了したら `IMPL_COMPLETED` と出力してください。"
