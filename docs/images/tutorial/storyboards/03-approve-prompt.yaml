# Tutorial Step 3 — answer a confirmation prompt from a phone (Issue #1575)
#
# The send beat is not decoration. fake-agent.sh replays a cassette whose rows
# block on `@input` until CommandMate actually sends a message, so the approval
# frame is never painted unless something sends first. A storyboard that placed
# `respond-from-mobile` alone would hang in prepare until the timeout.
# storyboard.test.ts pins that ordering.

version: 1
duration: 11
output: cm-t3-approve-prompt
scenes:
  - id: send-and-generate
    type: record
    duration: 5
    viewport: pc
    telop:
      ja: "作業を依頼して離席する"
      en: "Send the task and step away"
  # 6s rather than 7: the mobile take opens on the shell's own first paint, and
  # compose.sh keeps the *tail* of a take that overruns its slot. A shorter slot
  # therefore seeks past the spinner and starts on the prompt sheet itself.
  - id: respond-from-mobile
    type: record
    duration: 6
    viewport: mobile
    telop:
      ja: "承認待ちはスマホで応答"
      en: "Answer the prompt from your phone"
