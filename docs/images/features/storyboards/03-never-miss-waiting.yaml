version: 1
duration: 20
output: cm-03-never-miss-waiting
scenes:
  - id: sessions-overview
    type: record
    duration: 4
    viewport: pc
    telop:
      ja: "承認待ちを見逃さない"
      en: "Never miss a waiting approval"
  - id: send-and-generate
    type: record
    duration: 7
    viewport: pc
    telop:
      ja: "止まった瞬間に分かる"
      en: "Know the moment it stops"
  - id: respond-from-mobile
    type: record
    duration: 5
    viewport: mobile
    telop:
      ja: "その場で答えて再開"
      en: "Answer on the spot, resume"
  - id: complete
    type: record
    duration: 3
    telop:
      ja: "放置時間がゼロに"
      en: "No more idle hours"
  - id: outro
    type: card
    duration: 1
    telop:
      ja: "github.com/Kewton/CommandMate"
      en: "github.com/Kewton/CommandMate"
