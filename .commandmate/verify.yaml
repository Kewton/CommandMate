# .commandmate/verify.yaml — v1
# 仕様: docs/design/verification-config.md
# ランナー: .claude/skills/cmate-verify/scripts/verify-run.sh
#
# ゲートは CI（.github/workflows/ci-pr.yml）の lint / type-check / test-unit と、
# 静的ガード 3 本（token-discipline / control-chars / claudemd-size）を宣言している。
# build は稼働サーバの足元で走らせると配信中の成果物を壊すため、
# skipInPrimaryCheckout が守る linked worktree でのみ意味を持つ。
#
# [Issue #1882] 静的ガード 3 本は CI と**同じスクリプト**（scripts/check-*.mjs）を呼ぶ。
# verify.yaml へ検査本体（grep や上限値）をコピーすると同じ検査の実装が 2 箇所に増え、
# 片方だけ更新されて静かに乖離する。実測はいずれも 0.1 分（ci-pr.yml 冒頭の計測表、n=12）
# なので裁定時間への影響はほぼゼロ。npm install も要らない（依存なしの Node スクリプト）。
#
# 事故の記録: PR #1881 は `wait --verify` が全ゲート exit 0 を返した commit が
# CI の Token discipline で FAILURE になった。宣言ゲートが lint/typecheck/unit の
# 3 本だけで、CI 11 ジョブのうち 8 本を見ていなかったため。
#
# ここに**追加しない**もの: Integration Tests（実測 2.1m）/ Legacy tmux（Docker 必須）/
# Security Audit（ネットワーク依存）/ Build（稼働サーバの足元を壊す）/ E2E（下記参照）。
version: 1
gates:
  # 静的ガード（各 0.1m）。失敗を秒で返せるよう、重いゲートより前に置く。
  # ランナーは失敗しても後続ゲートを止めないので、順序は報告順にしか効かない。
  # [Issue #1917] この 3 本に `mutex` を付けてはいけない。0.1s のガードを他 worktree の
  # 500s の unit の後ろに並ばせると、秒で失敗を返すという #1882 の設計意図が消える。
  # 不変条件は tests/unit/guards/verify-heavy-gate-mutex.test.ts が固定している。
  - id: token-discipline
    command: "node scripts/check-token-discipline.mjs"
    timeoutSec: 120
  - id: control-chars
    command: "node scripts/check-control-chars.mjs"
    timeoutSec: 120
  - id: claudemd-size
    command: "node scripts/check-claudemd-size.mjs"
    timeoutSec: 120
  # [Issue #1917] lint / typecheck に `mutex` は付けない。2 worktree 同時実行 6 ラン中
  # 6 回とも PASS で、キャッシュを揃えた A/B でも測れるほどの遅延が出ない
  # （単独 lint 5.3s / typecheck 2.5s ⇔ 同時 5.2s / 2.4s）。すなわち
  # 負荷起因の赤を出した実績が無い。一方 `mutex` を付けると、ロックが空かないまま
  # timeoutSec に達したゲートは SKIP reason=mutex-wait ＝ RESULT error ＝ exit 99
  # （裁定不能、9.4）になりうる。実在しない偽陽性を消すために、500s の unit の後ろに
  # 並んで裁定不能になる経路を新設することになるので割に合わない。
  - id: lint
    command: "npm run lint"
    timeoutSec: 900
  - id: typecheck
    command: "npx tsc --noEmit"
    timeoutSec: 900
  - id: unit
    # [Issue #1917] `mutex` は「マシン上でこのゲートを同時に 1 本だけ」にする宣言
    # （docs/design/verification-config.md 9.2）。並列ワーカーの `wait --verify` が
    # フル test:unit を同時に走らせると、diff と無関係のテストが負荷で落ちて exit 20 に
    # なる（実測: 単独 486-553s は PASS、同時実行の 640s だけ monitor-exit-codes.test.ts が
    # exit 130 を取り逃して FAIL。単独再実行は 16/16 PASS）。裁定が負荷で反転するなら
    # exit code で完了を判定する `/orchestrate` の設計が成り立たない。
    #
    # 名前が `unit` でも `test-unit` でもないのは 9.2 の規約による。mutex 名は
    # **ゲート ID ではなく資源の名前**であり、ここで奪い合っている資源は固定ポートでも
    # DB でもなく「このマシンで重いスイートを走らせる枠」＝ CPU と実時間である。
    # 資源名にしておくと、別リポジトリの同じくらい重いゲートが同じ `cpu.heavy` を
    # 宣言するだけで同じ枠を共有できる（9.2 が `port.60303` を例に挙げているのと同じ形）。
    # ゲート ID を名前にすると、同じ CPU を食う別リポジトリの `test` と排他できない。
    # `cpu` 単独にしなかったのは、5s の lint までこの枠を取りに来ると、失敗を秒で返す
    # という #1882 の設計意図が消えるため。`heavy` は入場条件そのものを名前にしている。
    #
    # 9.1 の env 注入（CM_WORKTREE_INDEX）は効かない。分けられる資源が無いためで、
    # 9 が「分けられるなら 9.1 を優先」と書いているケースには当たらない。
    command: "npm run test:unit"
    timeoutSec: 3600
    mutex: cpu.heavy
# e2e ゲートはここに**無い**。宣言したゲートは既定で毎回走るため（スキーマに「宣言はするが
# 既定では走らない」フラグは無い）、常設すると `wait --verify` の所要が 1 ワーカーあたり
# 5 分以上伸び、並列オーケストレーションの裁定時間に直結する（CI 実績 E2E 5m16s〜5m39s）。
# フル e2e は ci-pr.yml が PR ごとに回しており、verify ゲートはその複製ではない。
# 必要なときは以下を足すか、タスク契約の `verify.gates` に `e2e` を含める。ポートは
# playwright.config.ts が CM_WORKTREE_INDEX から導出するので、コマンド側に算術は要らない
# （Issue #1871。実機記録は docs/qa/1871-parallel-e2e-port-collision.md）。
#
#   - id: e2e
#     command: "npm run test:e2e"
#     timeoutSec: 1800
options:
  baseRef: origin/develop
  skipInPrimaryCheckout: true
  # 8192 では vitest の失敗サマリが途中で切れ、2 件の失敗のうち 1 件しか読めなかった。
  maxLogTailBytes: 32768
