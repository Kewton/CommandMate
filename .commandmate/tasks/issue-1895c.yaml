    - "src/lib/response-cleaner.ts"
    - "src/lib/polling/**"
    - "src/lib/session/**"
    - "src/config/**"
    - "tests/unit/**"
    - "tests/fixtures/**"
    - "tests/helpers/**"
    - "docs/**"
    - "CHANGELOG.md"
    - ".commandmate/tasks/issue-1895.yaml"
    - ".commandmate/tasks/issue-1895b.yaml"
    - ".commandmate/tasks/issue-1895c.yaml"
  deny: []


autoYes:
  mode: allow-listed
  allowPromptTypes: [yes_no, multiple_choice]
  denyPatterns:
    - "rm -rf"
    - "git push"
    - "gh pr create"
    - "gh issue edit"
    - "kill-server"

verify:
  gates: [lint, typecheck]

success:
  requireWorkEvidence: true
  requireScopeClean: true
