# Issue #228: the run directory ($WORKDIR) has to outlive every gate of a run.
#
# The shape that exposed the defect is MANY INSTANTANEOUS gates in ONE run. A gate
# that is already dead before the runner has even forked its timeout watchdog makes
# the runner's `wait` return at once, so the `kill` that stops that watchdog lands
# inside the window between the watchdog's `fork()` and the point where bash resets
# the child's signal dispositions — and a bash child killed by a CATCHABLE signal in
# that window runs the EXIT trap string it inherited, which used to `rm -rf` this
# run's work directory while the run was still going.
#
# Every gate fails on purpose so the runner has to print each one's captured log:
# a gate whose log went missing says `no output captured` and its marker never
# appears, which is exactly the CI symptom this fixture pins.
version: 1
gates:
  - id: wl01
    command: echo wl01-ran; exit 9
  - id: wl02
    command: echo wl02-ran; exit 9
  - id: wl03
    command: echo wl03-ran; exit 9
