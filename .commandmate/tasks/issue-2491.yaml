    - "src/lib/session/resolve-session-target.ts"
    - "src/lib/relay/relay-session-ref.ts"
    - "src/lib/db/agent-instances-db.ts"
    - "tests/unit/app/api/worktrees/**"
    - "tests/unit/session/**"
    - "tests/unit/relay/**"
    - "tests/integration/**"
  deny: []
verify:
  gates: null
success:
  requireWorkEvidence: true
  requireScopeClean: true
