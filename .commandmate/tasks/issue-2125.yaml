version: 1
title: "Issue #2125: 検証ゲート不合格の通知にインスタンス名が入らない"
goal: |
  /bug-fix https://github.com/Kewton/CommandMate/issues/2125 を実装してください。

  ## 何が起きているか（2026-08-27 実機 UAT の実測）

  `commandmate verify` から上がる検証ゲート不合格の通知に、**インスタンス名が入りません**。
  iPad（iPadOS 18.7 / APNs）で実際に届いたカード:

  ```
  uat/push-2002 from CommandMate          ← タイトル（`from CommandMate` は iOS が付けるアプリ名）
  検証ゲート不合格：lint                   ← 本文
  ```

  **本文は理想的**で、`lint` という具体的なゲート名まで出ており、ロック画面で展開せずに
  失敗と読めます。**問題はタイトルだけ**です。

  手順書 `docs/qa/1999-2000-push-quieting-uat.md` の L-3 は受入条件として
  「タイトルが `<worktree 名> (<インスタンス>)` になっており、どの作業の話か分かる」
  と定めていますが、`(claude)` が付いていません。

  記録は `docs/qa/2002-push-uat-record.md` §3 にあります。

  ## 原因（特定済み。ただし自分で裏を取ること）

  ```ts
  // src/lib/push/push-sender.ts:334-335
  const agentSuffix = event.agentName ? ` (${event.agentName})` : '';
  const title = `${event.worktreeName}${agentSuffix}`;
  ```

  `agentName` が空なので接尾辞が付きません。その出所:

  ```ts
  // src/lib/verification/gate-runner.ts:1453
  instanceId: input.instanceId ?? null,
  ```

  **`commandmate verify` は instance を指定しないので `null` が渡ります。**
  `resolveWorktreeName` は DB の `name` 列を返すので、タイトルはブランチ名
  （`uat/push-2002`）になります。

  **待機通知（`kind: 'prompt'`）側は `instanceId` が渡るので `(claude)` が付きます。
  失敗通知だけがこの情報を落としています。**

  ## なぜ困るか

  並列運用では 1 つの worktree に複数インスタンス（`claude` / `claude-2` / `codex` …）が居ます。
  インスタンス名が無いと、通知を見ても**どれが落ちたか特定できません**。
  Epic #2002 は「対応が必要なときだけ鳴らす」を目的にしていますが、
  **鳴った先で対象を特定できなければ対応に移れません。**

  ## 実装方針（推奨。逸脱してよいが、逸脱したら理由を報告すること）

  1. **`verify` 実行時に対象インスタンスを解決して渡す**
     `GET /api/worktrees/:id/resolve-target` が**サーバ側の権威**です（#1925）。
     CLI 側で独自に優先順位を再実装しないこと —— #1925 は「クライアントとサーバが別の答えを出して
     1 つの tmux セッション名が作られる」事故を受けて、サーバを唯一の権威にした変更です。
  2. **インスタンスを特定できない検証の表記を決める**
     いまは黙って省略されるので、「worktree 全体の検証」なのか「情報が落ちた」のか区別できません。
     **黙って省略しない**形にすること。

  ## 受入条件

  - `commandmate verify` の失敗通知に、対象インスタンスが分かる表記が入る
  - インスタンスを特定できない検証では、それと分かる表記になる（**黙って省略しない**）
  - **待機通知側の表記は不変**（`<worktree名> (claude)` のまま）。ここを壊すと #1790 の回帰
  - **変異注入で赤になることを確認する**（リポジトリ全体で判定し、赤になったファイルを列挙）

  ## やってはいけないこと

  - **ポート 3000 のサーバを停止・再起動しないこと。** 稼働中です
  - **ユーザーの `.env` を読み書きしないこと**（実鍵が入っています）
  - 検証でサーバを起こす必要があれば `CM_PORT` で 3900〜3999 の空きを使い、
    `CM_DB_PATH` を worktree 配下の一時 DB に向けること
  - **実機での確認はできません。** 「iOS で届いた」等を実測として書かないこと。
    上記の実測値はオーケストレーターが UAT で採ったものとして引用し、
    あなた自身が測っていないことは「未計測」と明記すること

  ## 変異注入について

  「変異が赤にならない ＝ 空振り」と即断しないこと。#2040 で、変異を入れても対象 Issue の
  6 ファイルが全部緑なのに、リポジトリ全体を回すと別ファイルの 3 テストが捕まえていた事例がある。
  変異は**構造を保つもの**（値の入れ替え・境界のずらし・条件の反転）にし、
  byte-identical に復元して md5 で検証すること。

  ## 並行して動いているワーカーがあります

  **#2123 + #2124 のワーカーが同時に走っています。** あちらは `src/lib/push/**`（`vapid.ts` /
  `push-sender.ts` を含む）/ `server.ts` / `src/cli/commands/init.ts` / `status.ts` /
  docs を触ります。**`src/lib/push/**` はあなたの scope 外**です。

  タイトルの組み立ては `push-sender.ts:334` に在りますが、**そこは触らずに済むはず**です
  （`agentName` に値が入れば接尾辞は自動で付く）。もし `push-sender.ts` の変更が
  どうしても必要なら、**止めて報告してください**。オーケストレーターが調整します。

  ## 作業ルール（厳守）

  - **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。
    代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には入りません。
    - `dev-reports/changelog/issue-2125.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま
      貼れる **1 エントリ**（先頭は `- **<type>(<scope>): …** (#2125): …`）。どの節
      （`### Added` / `### Changed` / `### Fixed`）に入るかを 1 行目にコメントで書く。
      **形式は次の実例に合わせてください**（develop の `CHANGELOG.md` にある実エントリを丸ごと 1 本。
      エントリは**ファイル中では 1 行**で、下で折り返して見えるのは表示上の都合です）:

      ```markdown
      <!-- ### Fixed -->
      - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた（隔離サーバ実測 2026-08-22 / copilot 1.0.80: `send`→`wait` 5 回中 3 回が約 0.3 秒・`basis=scraper_ready`・成果物ゼロで exit 0）。ゲートは `GET /api/worktrees/:id/messages?limit=1&unit=pairs` を `--instance`（無指定ならサーバが解決した `cliToolId`）でスコープして読む。**hook を出さないツールは挙動不変** — `structuredEvents.source.capabilities.supportedEvents`（#1924 の宣言値）が `stop` とターン開始語の両方を宣言しているソースだけがこのゲートに入り、legacy-relay（`supportedEvents: []`）と #1924 以前のサーバは従来経路のまま台帳も引かない。保留は `PENDING_PROMPT_HOLD_MS`=60 秒で打ち切り（hooks は全経路 fail-open なので `Stop` の取りこぼしで `wait` が返らなくなってはいけない）、`--timeout` / `--stall-timeout` はそれより短ければ従来どおり優先される。完了行の `basis=` は、エージェントが最新プロンプトの終了を報告していれば `hook_stop` になる（`scraper_ready` は「画面しか言っていない」という文書どおりの意味に戻る）。
      ```

      - `- **` で始めること — 集計は `grep -cE '^- \*\*'` なので、外れるとエントリとして数えられません。
      - `(#2125)` は要約の**外**（`**` を閉じた後）に置くこと。
      - `<type>` は CLAUDE.md のコミットメッセージ規約と同じ語彙。
      - 1 エントリ＝1 行（折らない）。
    - `dev-reports/module-reference/issue-2125.md` — `docs/module-reference.md` の表に足す注記を
      **行キー（`| \`path\` |`）ごと**に列挙する。既存行への追記なら「どの行に何を足すか」を書く。
      **既存行に足すときは `grep -n '^| \`<path>\`' docs/module-reference.md` を実行し、その出力
      （行番号つきの行キー）を断片に書き写してから**書くこと。0 件だった行への追記を指示しない
      （新しい行を足すなら「新規行」と明記する）。足すものが無ければ「追記なし」の 1 行でよい。
      **注記本文に `|` を含めるときは `\|` にエスケープすること**。実例:

      ```markdown
      ## 既存行への追記
      - `src/lib/session/worktree-status-helper.ts` — 実在確認: `docs/module-reference.md:103`（行番号は確認時点のもの）
        追記内容: 「private `getStatusCaptureLines()` を削除し `resolveCaptureSpec(cliToolId).statusLines` に置換（Issue #1933）」

      ## 新規行
      追記なし
      ```
  - **commit は 1 本にまとめること。PR は作らないこと**（オーケストレーターが作ります）。
  - 作業ツリーをクリーンにして終えること。
  - Issue 本文を書き換えないこと。実測と食い違ったら**実測を正とし**、食い違いを報告に書くこと。
  - 完了したら最終行に `IMPL_COMPLETED` と出力すること。
scope:
  allow:
    - "src/lib/verification/**"
    - "src/lib/push/failure-push-notifier.ts"
    - "src/cli/commands/verify.ts"
    - "src/cli/types/**"
    - "src/app/api/worktrees/**"
    - "tests/unit/**"
    - "tests/integration/**"
    - "locales/**"
    - "docs/design/**"
  deny:
    - "CHANGELOG.md"
    - "docs/module-reference.md"
    - "CLAUDE.md"
    - ".env"
    - "src/lib/push/push-sender.ts"
    - "src/lib/push/vapid.ts"
    - "server.ts"
verify: {}
success:
  requireWorkEvidence: true
  requireScopeClean: true
