version: 1
duration: 20
output: cm-05-send-and-walk-away
scenes:
  - id: title
    type: card
    duration: 3
    telop:
      ja: "指示を送ったら、あとは任せる"
      en: "Send the task, then walk away"
  - id: sessions-overview
    type: record
    duration: 3
    viewport: pc
    telop:
      ja: "セッションを開いて"
      en: "Open a session"
  - id: send-and-generate
    type: record
    duration: 8
    viewport: pc
    telop:
      ja: "メッセージを送るだけ"
      en: "Just send a message"
  - id: respond-from-mobile
    type: record
    duration: 2
    viewport: mobile
    telop:
      ja: "あとは手を離していい"
      en: "Hands off from here"
  - id: complete
    type: record
    duration: 2
    telop:
      ja: "戻ったら終わっている"
      en: "Come back to it done"
  - id: outro
    type: card
    duration: 2
    telop:
      ja: "github.com/Kewton/CommandMate"
      en: "github.com/Kewton/CommandMate"
