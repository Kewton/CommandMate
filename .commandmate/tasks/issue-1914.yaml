version: 1
title: "Issue #1914: docs / i18n / CMATE 既定の是正（6 ツール前提への追随）"
goal: |
  /bug-fix 1914

  https://github.com/Kewton/CommandMate/issues/1914 を修正してください。
  ## オーケストレーター契約（Issue 本文より優先・厳守）

  1. **PR を作成しない・push しない**（オーケストレーターが行います）。ブランチは checkout 済みです。
  2. 実装は**このブランチ上の単一 commit** にまとめる。メッセージは `<type>(<scope>): <要約> (#N)` 形式。
  3. commit に含めてよいのは `src/` `tests/` `docs/` `scripts/` `.eslintrc.json` `CHANGELOG.md`
     `.commandmate/tasks/issue-N.yaml` のみ。**`dev-reports/` は絶対に含めない**（CI の hygiene で落ちます）。
  4. `CHANGELOG.md` は `## [Unreleased]` に**自分の 1 行だけ**追加する。他の行を並べ替えない・消さない
     （並列ワーカーが同じ節を触っており、衝突解消はオーケストレーターが機械的に行います）。
  5. **GitHub の Issue / PR を編集しない**（`gh issue edit` 禁止）。Issue レビューのフェーズも実行しない。
     Issue 本文の誤りは**コミットメッセージの「意図的な逸脱」節**に書いて渡すこと。
  6. 完了したら最終行に `IMPL_COMPLETED` とだけ出力して停止する。

  ## 実装方針は「推奨」であって決定ではない

  Issue 本文と設計方針書の実装方針は**推奨**です。**必ず実コードで裏を取り、実測が食い違ったら
  実測を正とし、乖離をコミットメッセージに明記してください。** 過去に私（オーケストレーター）が
  書いた方針が 3 回連続でワーカーの実測に覆されています。逸脱報告は歓迎します。

  ## 正本ドキュメント

  - 設計方針書: `docs/design/multi-agent-state-architecture.md`（develop に着地済み、Stage 1-4 レビュー済み）。
    §4 D1〜D5 / §8 / §13.2 を正とする。**Issue 本文と方針書が食い違ったら方針書を正**とする。
  - Issue 本文中の設計方針書リンクが 404 になる場合は上のローカルパスを見ること。

  ## テスト実行のルール（重要・厳守）

  - **フル `npm run test:unit` を自分で回さないでください。** 並列ワーカーが同時にフル実行すると
    diff と無関係のテストが `Test timed out in 5000ms` で落ち、存在しない回帰を追いかけることになります
    （実測済み。#1917 で `verify.yaml` の unit ゲートに `mutex: cpu.heavy` を入れた理由がこれです）。
  - 自分が触った/追加したテストだけ `npx vitest run <path>` で確認する。
  - 全体の裁定はオーケストレーターが `commandmate wait --verify`（`.commandmate/verify.yaml` の全ゲート）
    で行います。どうしても全体を回したい場合のみ `.claude/skills/cmate-verify/scripts/verify-run.sh`
    （mutex 準拠）を使ってください。
  - **`npm run build` を実行しない**（稼働中サーバの配信成果物を壊します）。
  - `npm run lint` / `npx tsc --noEmit` は軽いので自由に回してよい。

  ## 環境ルール（厳守）

  - **稼働サーバ（port 3000）を停止・再起動しない。** 隣の `MyCodeBranchDesk` ディレクトリで何もしない。
  - 実 tmux を触る検証は必ず `tmux -L <専用socket>` で行う（`-L`/`-S` は `$TMUX` より優先）。
    フラグ無しの `tmux` は**ユーザーの本番セッション**に届きます。`kill-server` を `-L` 無しで打たない。
    後始末は `kill-session -t '=<name>:'`。`TMUX_TMPDIR` は隔離手段にならない（`$TMUX` があると無視）。
    `bind-key` / `unbind-key` / `set-option -g` を既定サーバへ撃たない。
  - 他の worktree（`../commandmate-issue-*`）に触らない。

  ## 完了条件

  Issue の受入条件をすべて満たし、`npm run lint` と `npx tsc --noEmit` が緑、追加したテストが
  単独実行で緑であること。**ガード/pin 系のテストは変異注入で赤になることを必ず確認**してください
  （空振り緑を作らない。確認手順と結果をコミットメッセージに書く）。

  ## この Issue 固有の注意

  - **本文の行番号は develop `90b67eb9`（2026-08-21）時点**です。以後 #1886 / #1922 / #1904 が
    着地して**ずれています**。行番号ではなく**内容で検索**して直してください。
  - **`docs/module-reference.md` は表です。** 既存行の注記セルに追記する形にし、
    **同じパスの行を 2 本にしない**でください（並列ワーカーが同じ行を触ります）。
  - 3.（CMATE の `default:` 分岐）は**挙動変更**なので、opencode に明示 case を足すときは
    「permission 無し・`--model provider/model` パススルー」であることを**テストで pin** し、
    CHANGELOG に挙動変化として書いてください。到達不能だった
    `claude-executor.ts` の `opencode run -m ollama/…` 分岐も同時に整理すること。
  - 4.（`status.claudeIsThinking`）は `{toolName}` 補間へ。**next-intl のモックは補間 param を
    落とす**ので、補間値の assert は実辞書で行うこと（モックのままだと偽 PASS になります）。
  - 1. の hooks ドキュメントには **copilot が機械共通の `~/.copilot/settings.json` を
    書き換える**こと、hook は `CM_AGENT_WORKTREE_ID` 無しでは不活性であること、
    決定予算 10 秒、`CM_AGENT_HOOKS_INJECT=0` の opt-out、opencode は `--port` + SSE で
    CommandMate が購読する側であることを**ツール別表**で書いてください。
    なお #1904（マージ済み）で copilot の hooks 設定は「config.json に hooks があれば
    settings.json を書かずに素の起動へ落ちる」「原子的置換＋ロック」に変わっています。
    実装を読んで現状を書くこと。
  - 5. の CLI リファレンスは `--instance` 単独形が正で、`--agent` は roster 外の
    アドホック起動用です（#1638）。`instances` / `verify` / `sync` / `--contract` を足す。

# [#1914 実測] scope.allow の 2 件は実在しないパスだった。
#   src/lib/schedule-config.ts  -> 実体は src/config/schedule-config.ts
#   src/lib/claude-executor.ts  -> 実体は src/lib/session/claude-executor.ts
# さらに Issue 3. の「opencode に --model provider/model パススルー」は
#   src/lib/cmate-cli-tool-parser.ts (TOOLS_WITH_MODEL_SUPPORT)
#   src/lib/job-executor.ts        (resolveModelOption が copilot/vibe-local のみ)
#   src/lib/session/claude-executor.ts (buildCliArgs の `ollama/` 前置)
# の 3 ファイルを同時に触らないと成立せず、いずれも旧 allow の外だった。
# scope は send 時スナップショットで裁定されるため、この修正だけでは今回のランの
# 裁定は変わらない。**上記 5 パスを含めて再 send すること**（残作業の詳細は commit message）。
scope:
  allow:
    - "docs/**"
    - "locales/**"
    - "src/lib/assistant/**"
    - "src/lib/cmate-parser.ts"
    - "src/lib/cmate-validator.ts"
    - "src/lib/cmate-cli-tool-parser.ts"
    - "src/config/schedule-config.ts"
    - "src/lib/session/claude-executor.ts"
    - "src/lib/job-executor.ts"
    - "src/lib/hooks/sources/registry.ts"
    - "src/components/**"
    - "tests/unit/**"
    - "tests/helpers/**"
    - "CHANGELOG.md"
    - ".commandmate/tasks/issue-1914.yaml"
  deny: []


autoYes:
  mode: allow-listed
  allowPromptTypes: [yes_no, multiple_choice]
  denyPatterns:
    - "rm -rf"
    - "git push"
    - "gh pr create"
    - "gh issue edit"
    - "kill-server"

success:
  requireWorkEvidence: true
  requireScopeClean: true
