version: 1
title: "Issue #2162: /copy の description が codex 0.151.0 と食い違う問題を直す"
goal: |
  /pm-auto-issue2dev

  https://github.com/Kewton/CommandMate/issues/2162 を実装してください。

  ## 事象（実測済み。裏取り不要）

  スラッシュコマンドパレットが出す `/copy` の説明が、**codex 0.151.0 の実際の文面と食い違っています。**

  ソース側の変化（`codex-rs/tui/src/slash_command.rs`、0.149.1 → 0.151.0）:

  ```diff
  -            SlashCommand::Copy => "copy last response as markdown",
  +            SlashCommand::Copy => "copy the last response, code block, or quote",
  ```

  出荷中の値（develop 実測）:

  ```
  en: "Copy the last response to the clipboard as markdown"
  ja: "直近の応答を Markdown としてクリップボードにコピー"
  ```

  **0.149.1 の codex 文面に一致**しており、0.151.0 とは食い違います。

  キーの共有状況（カタログ実測）— **3 ツールが 1 つのフラットキーを共有**しています:

  ```
  tools=['claude']  descriptionKey=slashCommands.descriptions.copy
  tools=['codex']   descriptionKey=slashCommands.descriptions.copy
  tools=['copilot'] descriptionKey=slashCommands.descriptions.copy
  ```

  ---

  ## やること 1: 3 ツールが `/copy` で何を意味するかを**実際にソースを読んで**確かめる

  **これが本題です。** A/B の判断はここで決まります。

  読む先は `src/config/slash-commands-attestations.json` の各レコードの **`source` フィールド**が
  指しています（「どこを見ればこの測定を再現できるか」の指示になっています）:

  | tool | source |
  |---|---|
  | claude | `https://code.claude.com/docs/en/commands.md` の built-in slash command table |
  | codex | `openai/codex` の `codex-rs/tui/src/slash_command.rs` @ tag `rust-v0.151.0` |
  | copilot | `copilot help commands`（GitHub Copilot CLI 1.0.80） |

  既知の手がかり: claude docs の `/copy` は **引数 `[N]` を取ります**。

  > `/copy [N]` … Copy the last assistant response to clipboard. Pass a number `N` to copy the
  > Nth-latest response…

  codex の 0.151.0 は `"copy the last response, code block, or quote"` で、**コピー対象が
  「応答」だけでなく「コードブロック」「引用」にも及びます**。この時点で claude とは別物に見えますが、
  **copilot を読まずに決めないでください。**

  ## やること 2: A か B を決めて実装する

  | 案 | 内容 | 採る条件 |
  |---|---|---|
  | **A. フラットキーのまま文面を更新** | 3 ツール共通の説明として書き直す | 3 ツールの意味が**実質同じ**なとき |
  | **B. `copy.<tool>` へ分割** | `/recap`（#2158）や `/cd`（#2024）と同じ扱い | 意味が**違う**とき |

  **選んだ理由と、3 ツールそれぞれの原文引用を PR 本文に書いてください。**

  ### 判断がつかない場合は止まって報告すること

  copilot のソースが読めない、あるいは 3 ツールの意味が「同じとも違うとも言い切れない」場合は、
  **推測で決めないでください。** 実装せず、読めたところまでを
  `dev-reports/issue/2162/copy-semantics.md` に書いて `IMPL_COMPLETED` を出してください。
  **その状態で提出してもらって構いません。** 誤った統合や誤った分割の方が、未着手より高くつきます。

  ---

  ## 【重要】B を採る場合に連鎖するもの（#2158 の実測）

  `/recap` を分割したときに次が起きました。**同じことが起きます。**

  1. **フラット文字列と `<name>.<tool>` leaf は共存できません。** 旧キーに残すと解決が `undefined` に
     なるので、**claimant を全部 leaf へ書き換える**必要があります
     （`/recap` のときは claude 側エントリの `descriptionKey` も書き換えました）
  2. **`tests/unit/lib/slash-command-description-override.test.ts` のリテラル配列に leaf を追加**します。
     これは「人がキーを分割したことを記録する pin」で、テスト自身の docblock が
     「the engine refuses to split a key an earlier release already translated」と書いています。
     **期待値を緩めるのではなく、追加した leaf を配列に足すのが正しい対応です**
  3. **en / ja 両方**の辞書に leaf を用意します。ja は機械訳のままにせず、日本語として通る訳にしてください

  ## 触ってはいけないもの

  - **`src/config/slash-commands-attestations.json`**。attestation が記録するのは
    **コマンドの集合**であって description ではないので、本件では変更不要です。
    scope にも入れていません
  - **`src/config/slash-commands-exclusions.json`**
  - `/copy` 以外のコマンドの description

  ## 受入条件

  - **3 ツールそれぞれの `/copy` の意味が、原文引用つきで記録されている**
  - A か B かが**証拠に基づいて**決まっており、理由が書かれている
  - B を採った場合: フラットキーが残っておらず、**全 claimant が leaf を指している**
  - B を採った場合: override pin の配列に leaf が追加されている（**期待値を緩めていない**）
  - en / ja 両方の辞書が更新され、**ja が機械訳のままでない**
  - `attestations.json` を変更していない
  - 判断がつかなかった場合は、**実装せず**読めたところまでを記録している

  ## 作業ルール（厳守）

  - **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。
    代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には入りません。

    - `dev-reports/changelog/issue-2162.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま
      貼れる **1 エントリ**（先頭は `- **<type>(<scope>): …** (#2162): …`）。どの節
      （`### Added` / `### Changed` / `### Fixed`）に入るかを 1 行目にコメントで書く。
      **形式は次の実例に合わせてください**（develop の `CHANGELOG.md` にある実エントリを丸ごと 1 本。
      エントリは**ファイル中では 1 行**で、下で折り返して見えるのは表示上の都合です）:

      ```markdown
      <!-- ### Fixed -->
      - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた（隔離サーバ実測 2026-08-22 / copilot 1.0.80: `send`→`wait` 5 回中 3 回が約 0.3 秒・`basis=scraper_ready`・成果物ゼロで exit 0）。保留は `PENDING_PROMPT_HOLD_MS`=60 秒で打ち切り、`--timeout` / `--stall-timeout` はそれより短ければ従来どおり優先される。
      ```

      - `- **` で始めること — 集計は `grep -cE '^- \*\*'` なので、外れるとエントリとして数えられません。
      - `(#2162)` は要約の**外**（`**` を閉じた後）に置くこと — `（Issue #2162）` を要約の中に埋めると
        機械的に取り出せません。
      - `<type>` は CLAUDE.md のコミットメッセージ規約と同じ語彙
        （`feat` / `fix` / `docs` / `refactor` / `test` / `chore` / `ci` / `style`）。
      - 1 エントリ＝1 行（折らない）。本文がどれだけ長くても改行を入れません。

    - `dev-reports/module-reference/issue-2162.md` — `docs/module-reference.md` の表に足す注記を
      **行キー（`| \`path\` |`）ごと**に列挙する。既存行への追記なら「どの行に何を足すか」を書く。
      **既存行に足すときは `grep -n '^| \`<path>\`' docs/module-reference.md` を実行し、その出力
      （行番号つきの行キー）を断片に書き写してから**書くこと。0 件だった行への追記を指示しない
      （新しい行を足すなら「新規行」と明記する）。足すものが無ければ「追記なし」の 1 行でよい。実例:

      ```markdown
      ## 既存行への追記
      - `src/lib/session/worktree-status-helper.ts` — 実在確認: `docs/module-reference.md:103`（行番号は確認時点のもの）
        追記内容: 「private `getStatusCaptureLines()` を削除し `resolveCaptureSpec(cliToolId).statusLines` に置換（Issue #1933）」

      ## 新規行
      追記なし
      ```

    断片が無いとリリースノートと module-reference に載りません。**実装と同じ commit の時点で書くこと。**

  - **PR を作らないでください。** PR 作成とマージはオーケストレーターが行います。
  - **commit は 1 本にまとめてください**（`<type>(<scope>): <subject>` 形式）。
  - Issue 本文を書き換えないでください。訂正が要る場合は commit メッセージか PR 用のメモに書いてください。
  - 実装が終わったら最後に `IMPL_COMPLETED` とだけ出力してください。

