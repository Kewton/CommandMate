# Flow settings for this repository (scripts/flow/config.mjs, docs/design/flow-wip-4368.md §7).
# wip.total: upper bound on unmerged branches (worktree branches + open PRs to the base).
# Advisory only: `node scripts/orchestrate/flow-wip.mjs check` exits 60 when the count reaches it.
# 8 = 5 active lanes + 3 waiting on PR (design H1). Revisit after a week of #4367 measurements.
version: 1
wip:
  total: 8
# relayWatch (#4418, docs/design/flow-relay-watch-4418.md): tick watches the PM's requests.
# pm: the PM's session. receivers: the sessions only the PM sends to (docs/orchestrate/team.md §1・§2:
# the judge claude-2 and the dev leader claude-3). A request there with no relay, a relay pending
# pendingMinutes with the receiver's screen unchanged screenMinutes, and a held or expired relay
# are recorded under <flowDir>/<slug>/relay-watch/; the last two are told to the PM's composer once.
# notifyNoRelay: a request with no relay is recorded only, not told, until #4420 (the relay fix)
# lands; the PM sends plain send for now. After #4420, set it to true here (design §5.1).
relayWatch:
  pm: { worktreeId: mycodebranchdesk, instanceId: claude }
  receivers:
    - { worktreeId: mycodebranchdesk, instanceId: claude-2 }
    - { worktreeId: mycodebranchdesk, instanceId: claude-3 }
  pendingMinutes: 60
  screenMinutes: 20
  notifyNoRelay: false
# milestone (#4642, docs/design/milestone-check-4642.md §4): the current Sprint, written by name.
# `node scripts/orchestrate/milestone-check.mjs check` never infers it (I4); it is moved by the PM
# in the same step as the Milestone itself when a plan change is approved. roadmapIssue is the
# Issue whose last comment records moves (M6); mergedWindowDays is how many days of merged PRs
# count as "just merged" (default 14).
milestone:
  current: "Sprint 13"
  roadmapIssue: 4461
  mergedWindowDays: 14
