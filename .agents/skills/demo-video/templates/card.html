<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>demo-video card</title>
    <!--
      Full-frame opaque title / outro card. Unlike telop.html this one is a
      complete frame, so ffmpeg turns it into a still segment rather than an
      overlay. System fonts only, for the same reason as telop.html.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(circle at 50% 38%, #16202c 0%, #0a0e14 72%);
      }
      #card-rule {
        width: 96px;
        height: 5px;
        border-radius: 3px;
        background: #22d3ee;
      }
      #card-text {
        max-width: 84%;
        color: #f5f7fa;
        text-align: center;
        font-family: 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans',
          'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif;
        font-size: 56px;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: 0.01em;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <!-- Injected with `element.textContent` by render-overlays.ts. -->
    <div id="card-text"></div>
    <div id="card-rule"></div>
  </body>
</html>
