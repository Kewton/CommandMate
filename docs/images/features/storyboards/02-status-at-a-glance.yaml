version: 1
duration: 20
output: cm-02-status-at-a-glance
scenes:
  - id: sessions-overview
    type: record
    duration: 4
    viewport: pc
    telop:
      ja: "どれが止まってるか一目で"
      en: "See which agent is stuck"
  - id: send-and-generate
    type: record
    duration: 8
    viewport: pc
    telop:
      ja: "状態は色で分かる"
      en: "Status you can read by color"
  - id: respond-from-mobile
    type: record
    duration: 4
    viewport: mobile
    telop:
      ja: "待機中はすぐ気づける"
      en: "Spot a waiting agent instantly"
  - id: complete
    type: record
    duration: 3
    telop:
      ja: "確認は一覧だけでいい"
      en: "One dashboard, every session"
  - id: outro
    type: card
    duration: 1
    telop:
      ja: "github.com/Kewton/CommandMate"
      en: "github.com/Kewton/CommandMate"
