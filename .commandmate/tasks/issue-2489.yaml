version: 1
title: "Issue #2489: commandmate remote --auth <all|remote-only>"
goal: |
  https://github.com/Kewton/CommandMate/issues/2489 を実装してください。
  `/pm-auto-issue2dev` ワークフローで着手すること。詳細・代替案・トレードオフは以下で
  確認できます:
    gh issue view 2489 --repo Kewton/CommandMate

  ## 概要
  `commandmate remote` に、認証をかける範囲を選ぶオプションを追加する。

  ```bash
  commandmate remote --auth all          # 既定。現行どおり全経路で認証（PC ローカルも含む）
  commandmate remote --auth remote-only  # Provider（Tailscale Serve / Cloudflare Quick Tunnel）
                                          # 経由だけ認証。PC ローカルはログイン不要
  ```

  ## 背景・課題
  現状 `remote` はサーバを `CM_AUTH_TOKEN_HASH` 付きで起動し、`src/middleware.ts` と
  `src/lib/ws-server.ts` は送信元を区別せず全リクエストに認証を要求する。そのため remote
  実行中は PC のブラウザからも `http://localhost:<port>` にログインを求められるが、
  トークンの平文はペアリング成功時に削除されており PC からログインする手段が無い。
  結果としてスマホと PC を併用できない。

  ## ⚠️ 最重要: 送信元 IP で「ローカル」を判定してはいけない
  Tailscale Serve も Cloudflare Quick Tunnel も upstream `http://127.0.0.1:<port>` に
  接続するため、**tunnel 経由のリクエストも `req.socket.remoteAddress` は 127.0.0.1** になる。
  loopback を免除すると tunnel 経由のリクエストが丸ごと無認証で通ってしまう。
  `Host` / `X-Forwarded-*` ヘッダでの判定も不可（クライアントが任意に付けられる。Provider が
  `Host` を書き換える実測もある）。

  ## 推奨方式: 入口（listener）を分ける
  - `remote-only` のとき、サーバは既存ポートに加えて **remote 専用の listener を 127.0.0.1
    の別ポートに立て**、Provider の upstream はそちらだけに向ける。
  - 認証の要否は「どの listener に着いたか」で決める。
  - `server.ts` は**両方の listener で**内部ヘッダ（例: `x-cm-ingress: local|remote`）を、
    クライアントが送った値を捨てて上書きする。`middleware.ts` はその値だけを見る
    （fail-closed: 値が無い・不明なら認証を要求する）。
  - WebSocket（`ws-server.ts` の upgrade）も同じ判定にする。HTTP と WS で判定がずれると
    片方だけ素通しになる。
  - remote 用 listener は**常に認証**。ローカル listener は `remote-only` のときだけ
    認証を免除する。

  ## ガード
  - `CM_BIND` が loopback 以外（`0.0.0.0` 等）のとき `remote-only` は拒否（exit 2）。
    ローカル listener が LAN に開いていると「ローカル＝認証なし」が LAN 全体に及ぶ
    （`remote` は現状 `CM_BIND` を読まないので、このモードでだけ読む）。
  - `remote stop` / 期限切れで閉じるのは、従来どおり Provider（＋remote 用 listener）だけ。
    PC 側は認証なしのまま使い続けられる。

  ## 想定影響ファイル
  - `src/cli/commands/remote.ts`、`src/cli/types/index.ts`、`src/cli/utils/remote-state.ts`
    — オプション、状態記録、Provider に渡すポート
  - `server.ts` — remote 用 listener、ingress ヘッダの上書き
  - `src/middleware.ts`、`src/lib/ws-server.ts` — ingress による認証判定
  - `src/cli/commands/start.ts` 周辺 — remote 用ポートの受け渡し
  - `src/lib/remote/tailscale.ts` / `cloudflare.ts` — port を受け取るだけの見込み

  ## 受入条件
  - [ ] `commandmate remote --auth remote-only` 実行中、PC から `http://127.0.0.1:<port>` /
        `http://localhost:<port>` の画面・API・WebSocket がログイン無しで使える
  - [ ] 同時に、Provider URL 経由の未認証リクエストは従来どおり遮断される（画面 307、
        API 401、WS 401）。ペアリング後は使える
  - [ ] remote 用 listener へ `X-Real-IP` / `X-Forwarded-For` / `Host` / 内部ヘッダを
        偽装して送っても認証を回避できないことを unit / integration テストで固定する
  - [ ] `--auth all`（既定・未指定）は現行と同じ挙動（既存テストが緑）
  - [ ] 不正値、および `CM_BIND` が loopback 以外での `remote-only` は exit 2
  - [ ] `remote status`（テキスト / `--json`）に認証範囲が出る
  - [ ] `remote-only` 中、PC 側の `commandmate ls` / `send` / `wait` / `capture` が
        トークン無しで動く
  - [ ] macOS 実機で、Tailscale Serve 経由（スマホ）は要認証・PC ローカルは認証不要である
        ことを確認する（実機確認が困難な場合は unit/integration での固定を優先し、
        実機未確認である旨を進捗報告に明記すること）
  - [ ] docs 更新: `docs/user-guide/cli-operations-guide.md` / `docs/user-guide/webapp-guide.md`
        / `docs/security-guide.md` / `docs/TRUST_AND_SAFETY.md`（`docs/en/` 配下の英語版も
        含む）

  ## 注意（並列実行）
  この worktree とは別に、#2488（`/rebuild` の stop/start 競合修正）が同じ `server.ts` を
  別の目的（`gracefulShutdown` 周辺）で変更しています。あなたの変更は remote 用 listener の
  新設に閉じ、`gracefulShutdown` 自体は触らないこと。マージ前にオーケストレーターが両者の
  統合を確認します。

  ## 作業ルール（厳守）
  - **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。
    代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には
    入りません。
    - `dev-reports/changelog/issue-2489.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま
      貼れる **1 エントリ**（先頭は `- **<type>(<scope>): …** (#2489): …`）。どの節
      （`### Added` / `### Changed` / `### Fixed`）に入るかを 1 行目にコメントで書く。
      形式は次の実例に合わせてください（エントリは**ファイル中では 1 行**）:

      ```markdown
      <!-- ### Added -->
      - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた（隔離サーバ実測 2026-08-22 / copilot 1.0.80: `send`→`wait` 5 回中 3 回が約 0.3 秒・`basis=scraper_ready`・成果物ゼロで exit 0）。ゲートは `GET /api/worktrees/:id/messages?limit=1&unit=pairs` を `--instance`（無指定ならサーバが解決した `cliToolId`）でスコープして読む。**hook を出さないツールは挙動不変** — `structuredEvents.source.capabilities.supportedEvents`（#1924 の宣言値）が `stop` とターン開始語の両方を宣言しているソースだけがこのゲートに入り、legacy-relay（`supportedEvents: []`）と #1924 以前のサーバは従来経路のまま台帳も引かない。保留は `PENDING_PROMPT_HOLD_MS`=60 秒で打ち切り（hooks は全経路 fail-open なので `Stop` の取りこぼしで `wait` が返らなくなってはいけない）、`--timeout` / `--stall-timeout` はそれより短ければ従来どおり優先される。完了行の `basis=` は、エージェントが最新プロンプトの終了を報告していれば `hook_stop` になる（`scraper_ready` は「画面しか言っていない」という文書どおりの意味に戻る）。
      ```

      - `- **` で始めること（`grep -cE '^- \*\*'` で数える）。
      - `(#2489)` は要約の**外**（`**` を閉じた後）に置くこと。
      - `<type>` は CLAUDE.md のコミットメッセージ規約と同じ語彙（`feat`/`fix`/`docs`/`refactor`/`test`/`chore`/`ci`/`style`）。
      - 1 エントリ＝1 行（折らない）。
    - `dev-reports/module-reference/issue-2489.md` — `docs/module-reference.md` の表に足す
      注記を**行キー（`| \`path\` |`）ごと**に列挙する。既存行に足すときは
      `grep -n '^| \`<path>\`' docs/module-reference.md` を実行し、その出力（行番号つきの
      行キー）を断片に書き写してから書くこと。0 件だった行への追記を指示しない。実例:

      ```markdown
      ## 既存行への追記
      - `src/lib/session/worktree-status-helper.ts` — 実在確認: `docs/module-reference.md:103`（行番号は確認時点のもの）
        追記内容: 「...」

      ## 新規行
      追記なし
      ```
  - 断片が無いとリリースノートと module-reference に載らない。実装と同じ commit の時点で書くこと。
