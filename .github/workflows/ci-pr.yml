name: CI

# [Issue #1830] Every job in this file carries `timeout-minutes`.
#
# WHY. GitHub's default job timeout is 360 minutes (6 hours). On 2026-08-19 the
# `E2E Tests` job of run 32218070769 (develop, post-merge) sat inside
# `Install Playwright browser` for 88 minutes until a human noticed and
# cancelled it by hand; `gh run rerun --failed` then went green in 6m47s, so it
# was a transient runner/CDN problem and not a code regression. The other 10
# jobs of that run had all finished inside 12 minutes. With no `timeout-minutes`
# the only thing standing between that hang and a six-hour runner squat was
# somebody looking at the Actions tab.
#
# HOW THE NUMBERS WERE PICKED. Policy is `max x 2, floor 10`, measured on
# 2026-08-19 over the 12 most recent successful runs of this workflow
# (`gh run list --repo Kewton/CommandMate --workflow ci-pr.yml --limit 25 --json
# databaseId,conclusion` then `gh run view <id> --json jobs`, job duration =
# completedAt - startedAt):
#
#   job                                    n   median      max   timeout-minutes
#   E2E Tests                             12    6.2m    16.2m    30
#   Unit Tests                            12   12.3m    13.2m    30
#   Build                                 12    2.3m     2.5m    10
#   Integration Tests                     12    2.1m     2.4m    10
#   Type Check                            12    1.0m     1.1m    10
#   Lint                                  12    0.7m     0.9m    10
#   Legacy tmux (<3.2) reading-mode no-op  12    0.5m     0.8m    10
#   Security Audit                        12    0.5m     0.8m    10
#   Control character check               12    0.1m     0.2m    10
#   CLAUDE.md size check                  12    0.1m     0.2m    10
#   Token discipline                      12    0.1m     0.2m    10
#
# The distance to `max` is what keeps a healthy run from being cut. The tightest
# ratio here is Unit Tests at 2.3x; everything on 10 has 4x or more. Unit Tests
# is also the one to watch, because its median and max are nearly the same
# (12.3 / 13.2) — the suite has almost no slack of its own. Treat a run near 25m
# as a signal to shorten the suite, not as a reason to raise this number.
#
# STEP-LEVEL TIMEOUTS. A job-level cap tells you the job hung; it does not tell
# you where, which is exactly what was awkward to read in run 32218070769. So
# every step that WE invoke and that reaches the network for bytes — `npm ci`,
# `npx playwright install`, `apt-get install`, `npm install`, `npm audit` — also
# carries its own, much smaller cap, sized off the same sample. First-party
# GitHub actions (`actions/checkout`, `actions/setup-node`,
# `actions/upload-artifact`) are deliberately left to the job cap: they retry
# internally, they run against GitHub's own infrastructure, and none of them has
# ever been the step that hung.
#
# tests/unit/guards/workflow-timeouts.test.ts fails if a job in any workflow
# under .github/workflows/ is added without a `timeout-minutes`.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  claudemd-size:
    name: CLAUDE.md size check
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 0.1m median / 0.2m max (n=12); floor of the policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CLAUDE.md size
        run: |
          SIZE=$(wc -c < CLAUDE.md)
          LIMIT=35000  # 35kB hard cap (Issue #809). Store module detail in docs/module-reference.md.
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::CLAUDE.md size $SIZE exceeds limit $LIMIT bytes. See docs/module-reference.md for detail storage."
            exit 1
          fi
          echo "CLAUDE.md size: $SIZE bytes (under $LIMIT)"

  control-chars:
    name: Control character check
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 0.1m median / 0.2m max (n=12); floor of the policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # [Issue #1432] Hard-fail if a raw C0 control byte reappears in src/.
      # operation-lock.ts / preview-diff.ts carried a raw NUL (0x00) as a hash
      # separator, so file(1) called them `data` and grep/rg skipped them without
      # a word — hiding ~870 lines from every grep-based audit and codemod here.
      # `\x00` evaluates to the same byte, so escaping costs nothing.
      #
      # tests/ is intentionally out of scope: some suites need a raw control byte
      # as the fixture under test (NUL-rejection inputs, binary-content payloads),
      # and escaping those would change what is being asserted.
      # The script is dependency-free, so no npm install is needed.
      - name: Check for raw control characters in src/
        run: node scripts/check-control-chars.mjs

  token-discipline:
    name: Token discipline (raw gray/slate + chromatic guard)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 0.1m median / 0.2m max (n=12); floor of the policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against raw gray/slate + chromatic colors in migrated directories
        run: |
          # [Issue #1082 / #1116] Hard-fail if raw Tailwind color utilities reappear
          # in directories already migrated to semantic tokens. Same mechanism as the
          # CLAUDE.md size check above.
          #   - gray/slate  → neutral tokens (foreground / muted / muted-foreground /
          #                   border / surface / input / ring). (#1082, #1061)
          #   - chromatic (red/green/yellow/amber/orange/purple/violet/sky/blue)
          #                 → status tint tokens (bg-{status}-subtle /
          #                   border-{status}-border / text-{status}-foreground /
          #                   bg-{status}, status = success|warning|danger|info). (#1116)
          # Fix violations with the tokens in docs/design-system.md, NOT by editing
          # this whitelist.
          #
          # WHITELIST (guarded) = migrated dirs. #1061 added worktree/mobile/
          # external-apps; #1116 added error/ + auth/.
          # EXCLUDED (intentional always-dark islands / out of scope):
          #   - *Terminal* source files (incl. error/TerminalErrorFallback.tsx): the
          #     terminal output surfaces stay dark in BOTH themes, matching the fixed
          #     xterm theme (#1079) — they use raw dark utilities on purpose.
          #   - src/app/worktrees/**  (worktree detail route / terminal page, incl.
          #     CLI brand colors bg-purple-600/bg-blue-600/bg-green-600).
          # Test files (*.test.*, *.spec.*, __tests__) are excluded because they
          # assert on concrete class strings.
          PATTERN='(bg|text|border|ring)-(gray|slate|red|green|yellow|amber|orange|purple|violet|sky|blue)-[0-9]'
          MATCHES=$(git grep -nE "$PATTERN" -- \
            'src/app' \
            'src/components/ui' \
            'src/components/layout' \
            'src/components/home' \
            'src/components/review' \
            'src/components/repository' \
            'src/components/common' \
            'src/components/sidebar' \
            'src/components/providers' \
            'src/components/worktree' \
            'src/components/mobile' \
            'src/components/external-apps' \
            'src/components/error' \
            'src/components/auth' \
            ':(exclude)src/app/worktrees' \
            | grep -vE '\.test\.|\.spec\.|__tests__' \
            | grep -vE '^[^:]*Terminal[^:]*:' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Raw gray/slate or chromatic color utilities found in migrated directories (Issue #1082 / #1116). Replace with semantic tokens — see docs/design-system.md."
            echo "$MATCHES"
            exit 1
          fi
          echo "Token discipline: no raw gray/slate or chromatic utilities in migrated directories."

  legacy-tmux-readmode:
    name: Legacy tmux (<3.2) reading-mode no-op
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 0.5m median / 0.8m max (n=12); floor of the policy
    # Debian 11 ships tmux 3.1c — the newest tmux that still lacks display-popup,
    # so it is exactly the version a user most plausibly runs into. Using a
    # container is what makes an old tmux available at all; ubuntu-latest has
    # 3.4+, where this job could never fail.
    container: node:18-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # [Issue #1641] #1623 shipped the display-popup capability probe with both
      # branches covered by MOCKED return values and closed with "no-op on tmux
      # < 3.2" unverified — a mock cannot tell you whether the probe asks tmux the
      # right question. It does not: `tmux list-commands <unknown>` exits 0 with
      # empty stdout on 3.1c, and on 2.8 `list-commands` rejects a command
      # argument outright. This job runs the SHIPPED modules against a real old
      # tmux so a regression in that probe fails here instead of in a user's
      # terminal as `unknown command: display-popup`.
      - name: Install tmux
        # apt-get reaches the Debian mirrors; measured 0.05m max (n=12).
        timeout-minutes: 5
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tmux

      # Without this the job would keep passing if the base image ever moved to a
      # tmux that HAS display-popup — a silent no-op wearing a green check, which
      # is the exact failure mode #1641 exists to repay.
      - name: Assert the tmux under test really predates display-popup
        run: |
          RAW=$(tmux -V)
          NUM=$(printf '%s' "$RAW" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -z "$NUM" ]; then
            echo "::error::could not parse a version out of '$RAW'"
            exit 1
          fi
          if ! awk -v v="$NUM" 'BEGIN{split(v,a,"."); exit !(a[1]<3 || (a[1]==3 && a[2]<2))}'; then
            echo "::error::$RAW is 3.2 or newer; this job can no longer prove the no-op. Pin an older base image."
            exit 1
          fi
          echo "tmux under test: $RAW (pre-display-popup)"

      # esbuild is fetched standalone rather than via `npm ci` so this job needs
      # no native module build; the bundle pulls src/lib/tmux/** straight from the
      # checkout, which is what makes it the shipped code and not a paraphrase.
      # It is installed OUTSIDE the checkout on purpose: resolving `esbuild` from
      # the repo would pick up a node_modules built for another platform, and the
      # only symptom is `Exec format error` (measured while rehearsing this job in
      # a container with a macOS node_modules mounted).
      - name: Bundle the shipped reading-mode modules
        # `npm install esbuild` inside; measured 0.03m max (n=12).
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/probe" "$RUNNER_TEMP/tools"
          (cd "$RUNNER_TEMP/tools" && npm init -y >/dev/null && npm install --no-audit --no-fund esbuild@0.27.4 >/dev/null)
          "$RUNNER_TEMP/tools/node_modules/.bin/esbuild" scripts/legacy-tmux-probe/probe.ts \
            --bundle --platform=node --format=cjs --target=node18 \
            --tsconfig=tsconfig.json \
            --outfile="$RUNNER_TEMP/probe/probe.cjs"
          cp tests/unit/lib/tmux/fixtures/capture-claude-idle.txt "$RUNNER_TEMP/probe/fixture.txt"

      - name: Verify no-op + Plan B against real tmux
        env:
          CM1641_IN_CONTAINER: '1'
          EXPECT_SUPPORTED: '0'
        run: PROBE_DIR="$RUNNER_TEMP/probe" scripts/legacy-tmux-probe/in-container.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 0.7m median / 0.9m max (n=12); floor of the policy
    # TODO: Remove continue-on-error after fixing existing lint issues
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Registry fetch: 0.32m median / 0.37m max across the 84 samples of this
        # step in the run sample above, and a cold-cache `npm ci` of this
        # lockfile (572 packages, empty --cache dir, lifecycle scripts included)
        # measured 7s locally. 5 is ~13x the observed CI worst case.
        timeout-minutes: 5
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 1.0m median / 1.1m max (n=12); floor of the policy
    # TODO: Remove continue-on-error after fixing existing type errors
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Registry fetch: 0.32m median / 0.37m max across the 84 samples of this
        # step in the run sample above, and a cold-cache `npm ci` of this
        # lockfile (572 packages, empty --cache dir, lifecycle scripts included)
        # measured 7s locally. 5 is ~13x the observed CI worst case.
        timeout-minutes: 5
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    # measured 12.3m median / 13.2m max (n=12). 30 rather than the ~26 that
    # `max x 2` gives, because this suite grows with the test count and 13.2m
    # is already the slowest thing in the workflow after E2E.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Registry fetch: 0.32m median / 0.37m max across the 84 samples of this
        # step in the run sample above, and a cold-cache `npm ci` of this
        # lockfile (572 packages, empty --cache dir, lifecycle scripts included)
        # measured 7s locally. 5 is ~13x the observed CI worst case.
        timeout-minutes: 5
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=6144'

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 2.1m median / 2.4m max (n=12); floor of the policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Registry fetch: 0.32m median / 0.37m max across the 84 samples of this
        # step in the run sample above, and a cold-cache `npm ci` of this
        # lockfile (572 packages, empty --cache dir, lifecycle scripts included)
        # measured 7s locally. 5 is ~13x the observed CI worst case.
        timeout-minutes: 5
        run: npm ci

      # Issue #1102: the integration suite was drifting because it never ran in
      # CI. It is self-contained (in-memory SQLite + mocked fetch/tmux, no external
      # DB or network), so it runs the same way as the unit job. The one
      # environment-dependent case (external-apps duplicate-name → a real product
      # bug returning 500 instead of 409) is quarantined with it.skip + a reason
      # comment in the test file; see the Issue #1102 scope notes.
      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=6144'

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # measured 6.2m median / 16.2m max (n=12) — this is the job that hung for
    # 88 minutes in run 32218070769. 30 = ~2x the worst healthy run.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Registry fetch: 0.32m median / 0.37m max across the 84 samples of this
        # step in the run sample above, and a cold-cache `npm ci` of this
        # lockfile (572 packages, empty --cache dir, lifecycle scripts included)
        # measured 7s locally. 5 is ~13x the observed CI worst case.
        timeout-minutes: 5
        run: npm ci

      # Issue #1180: the E2E suite drifted for months because it never ran in CI
      # — same failure mode as the integration suite in #1102. Only chromium is
      # installed: playwright.config.ts declares a single chromium project (see
      # the comment there on why the Mobile Safari project was dropped).
      - name: Install Playwright browser
        # THE STEP THAT HUNG FOR 88 MINUTES (run 32218070769). It is measurably
        # bimodal — the browser download is at the CDN's mercy. Across the same
        # 12 runs: 0.28 0.30 0.32 0.33 0.35 0.35 0.37 0.40 0.77 1.07 4.90 10.55
        # minutes (median 0.36m, max 10.55m). 20 is ~2x that worst healthy run,
        # and after a full 20-minute stall the job's 30m cap still has room for
        # `npm ci` (0.4m) plus `Run E2E tests` (5.4m max) to finish, so this cap
        # only ever fires on something genuinely stuck.
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium

      # playwright.config.ts owns the isolation: it boots its own dev server on
      # port 3177 with CM_DB_PATH/CM_ROOT_DIR pinned to a throwaway state dir, so
      # no server or DB setup is needed here.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 2.3m median / 2.5m max (n=12); floor of the policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Registry fetch: 0.32m median / 0.37m max across the 84 samples of this
        # step in the run sample above, and a cold-cache `npm ci` of this
        # lockfile (572 packages, empty --cache dir, lifecycle scripts included)
        # measured 7s locally. 5 is ~13x the observed CI worst case.
        timeout-minutes: 5
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_IGNORE_ESLINT_DURING_BUILDS: true

      - name: Build CLI
        run: npm run build:cli

      - name: Build server
        run: npm run build:server

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10 # measured 0.5m median / 0.8m max (n=12); floor of the policy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Registry fetch: 0.32m median / 0.37m max across the 84 samples of this
        # step in the run sample above, and a cold-cache `npm ci` of this
        # lockfile (572 packages, empty --cache dir, lifecycle scripts included)
        # measured 7s locally. 5 is ~13x the observed CI worst case.
        timeout-minutes: 5
        run: npm ci

      - name: Run security audit
        # `npm audit` posts the tree to the registry; measured 0.03m max (n=12).
        timeout-minutes: 5
        run: npm audit --audit-level=critical
