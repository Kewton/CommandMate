version: 1
title: 'Issue #2109: opencode のセッション操作・共有リンクの失敗を画面に出す'
goal: "/bug-fix 2109\n\nIssue: https://github.com/Kewton/CommandMate/issues/2109\n**並列で #2108（根本原因側）が走っています。**ファイルは交わりません\n（#2108 は `hooks/sources/opencode/ports.ts` / `runtime.ts` / `server.ts` 側）。\n\n## この Issue の原因はオーケストレーターが特定したものです\n\n本文の「原因」節は 2026-08-26 の実測ですが、**書いたのはオーケストレーター**です。\n**最初にコードで裏取りし**、食い違ったら実測を正として差異を PR 本文に書いてください。\n\n本文が主張していること:\n\n- `OpencodeSessionControls.tsx:135-146` が `!response.ok` を `console.error` に流して `return` する。\n  **toast も inline 表示も無い**\n- `catch` 節（:151-153）も同じ\n- 押下フィードバックが `pending` スピナーだけなので、失敗すると**一瞬出て消えるだけ**＝「無反応」に見える\n- ルートは `code: 'NO_OPENCODE_PORT'` / `'NO_OPENCODE_SESSION'` という**機械可読な理由を返している**\n\n**共有リンク側（`onShare` / `onUnshare` / `shareCopy`）が同じ形かどうかは本文では未確認です。\nあなたが確かめてください。**\n\n## 直し方の方針\n\n- `showToast` は `MessageInput` が既に prop で受け取っており、\n  `TerminalSplitPaneContent.tsx:401,633` / `WorktreeDetailDesktop.tsx:567` /\n  `WorktreeDetailMobile.tsx:320` から配線されています。同じ仕組みに乗せるのが素直です\n- **`code` ごとに人間の言葉にする。** 少なくとも:\n  - `NO_OPENCODE_PORT` → 「このペインに opencode サーバが接続されていません」\n  - `NO_OPENCODE_SESSION` → 「まだ fork できるセッションがありません」\n  - それ以外 → ルートの `error` 文字列を素通し（`sync` と同じ規約）\n- 文言は `locales/{ja,en}/worktree.json` の `opencodeSession.*` に置く\n- **共有リンクの失敗も同じ扱いにする。** 共有は外部公開なので「発行できたのか分からない」が特に悪い\n\n## #2108 が直っても、この Issue は要ります\n\n`NO_OPENCODE_PORT` は #2108 で減りますが**ゼロにはなりません**\n（ペイン停止直後、`CM_AGENT_HOOKS_INJECT=0` で起動した場合）。\n`NO_OPENCODE_SESSION` に至っては**正常系の一部**です\n（まだ 1 ターンも走っていないペインで fork を押した場合）。\n**「#2108 が直るから不要」という結論にはしないでください。**\n\n## 再現\n\n409 を起こすのは簡単です。opencode ペインを起動してから**そのペインを停止**すれば\n`NO_OPENCODE_PORT` になります（`GET …/opencode/session` の `live` が false になることで確認できる）。\n`NO_OPENCODE_SESSION` は**まだ 1 ターンも走っていないペイン**で fork を押せば出ます。\n\n## 受入条件\n\n- 409 が返る状況でアイコンを押すと**画面に理由が出る**（実機）\n- `NO_OPENCODE_PORT` と `NO_OPENCODE_SESSION` は専用の文言、それ以外はルートの `error` を素通し\n- 共有リンクの発行・取り消し・コピーの失敗も画面に出る\n- **成功時の挙動は不変**（余計な toast を出さない）\n- **opencode 以外のツールでは何も変わらない**（`OpencodeSessionControls` は `null` を返すまま）\n- **変異注入で赤になることを確認する。** 構造を保つ変異を当て、実施後にバイト一致で復元すること\n\n## 実機計測の安全規則（厳守）\n\nこの Issue は opencode 1.18.22 の実機計測を伴います。手順は\n`docs/design/opencode-server-live-verification.md` §4「再現環境（ハーネス）」にありますが、\n**§4 には CommandMate 経由の計測に効かない穴があります。**下記を先に読んでください。\n\n### ⚠️ §4 の HOME 隔離は CommandMate 経由では効きません（2026-08-26 に実害）\n\n`tmux new-session` のペインは**クライアントではなく tmux サーバのプロセス環境**を継ぎます。\n`HOME` は tmux の `update-environment` 既定リストに無いので、**CommandMate サーバに\n`HOME=<scratchpad>` を与えても、既定 tmux サーバに作られたペインは実 HOME のまま**です。\n§4 は「素の `opencode serve` にコマンドラインで `HOME=` を渡す」前提で書かれています。\n\nこれを踏んで、ユーザーの `~/.local/share/opencode/opencode.db` に書き込む事故が実際に起きました。\n\n**CommandMate 経由で計測するときの正しい手順:**\n\n1. 隔離 HOME を**持つプロセスとして**私設 tmux サーバを起こす:\n   `env HOME=\"$SP/home\" tmux -L cm<issue> new-session -d -s probe`\n2. ペインの HOME を実測して確認する:\n   `tmux -L cm<issue> send-keys -t '=probe:' -l -- \"printenv HOME > $SP/probe.txt\"` ＋ `Enter`\n3. socket と pid を取る:\n   `tmux -L cm<issue> display-message -p '#{socket_path}'` / `'#{pid}'`\n4. CommandMate dev server の env に `TMUX=\"<socket_path>,<pid>,0\"` を渡す\n   （`src/lib/tmux/tmux.ts` は socket 引数を取らないので `$TMUX` が唯一の経路）\n5. **セッション起動直後に `GET /path` の `home` が scratchpad 配下であることを確認する。**\n   外れていたら**即** `kill-session -t '=<name>:'`。これは初期チェックではなく**毎回の関門**です\n\n### 隔離 dev server の立て方\n\n- このシェルは `NODE_ENV=production` / `CM_PORT=3000` / `CM_DB_PATH=<本番>` を export 済みです。\n  **すべて明示で上書きしてください**（忘れると本番サーバ・本番 DB を掴みます）。\n- `NODE_ENV=development CM_PORT=<空きポート> CM_BIND=127.0.0.1\n  CM_DB_PATH=/Users/maenokota/.commandmate/data/cm-uat-<issue>.db\n  WORKTREE_REPOS=<計測用 repo> node_modules/.bin/tsx server.ts`\n- `CM_DB_PATH` は **homedir 配下**にすること（scratchpad は `validateDbPath()` に拒否されて起動が落ちます）。\n- **3000 番は絶対に使わない。** ポートは `47xx` 帯から選ぶ（`48xx` は他の計測と衝突した実績あり）。\n- `lsof` で空いていたことは次の瞬間の保証になりません。上の `GET /path` ゲートで毎回確かめてください。\n\n### opencode 自体について\n\n- **`HOME` ごと差し替える。** opencode は `~/.config/opencode`・`~/.local/state/opencode`・\n  `~/.local/share/opencode`（**`opencode.db` を含む**）を `$HOME` から解決し、1 ターン動かすだけで書き込みます。\n- **`auth.json` は mode 600 で複製し、検証後に削除する。**\n- **TUI のモデルピッカーを開かない**（既定モデルを書き換えます）。config でモデルを固定すること。\n\n### tmux\n\n- **`kill-server` を `-L` 無しで書かない。** 後始末は `kill-session -t '=<name>:'`（完全一致）。\n- **`TMUX_TMPDIR` を隔離手段に使わない**（`$TMUX` が設定されていると無視されます）。\n- **`bind-key` / `unbind-key` / `set-option -g` を既定サーバへ撃たない。**\n- 既定サーバにはユーザーの本番セッションが 37 本生きています。壊すと巻き添えになります。\n\n## 計測できなかった場合\n\n**推測で埋めないでください。**「計測できなかった」ことと理由を設計書と commit に書き、\nコード側は計測に依存しない範囲だけを実装してください。\n\n## 作業ルール（厳守）\n\n- **Issue 本文を書き戻さないでください。** Issue の管理はオーケストレーターが行います。\n  本文とコード／実機が食い違ったら**実測を正**とし、差異は commit メッセージと docblock に残してください。\n- **PR を作らないでください。** commit までで止めてください。\n- 作業は **単一 commit** にまとめてください。\n- 新規テストファイルは `-2109` の接尾辞をつけてください。\n- **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。\n  代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には入りません。\n  - `dev-reports/changelog/issue-2109.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま\n    貼れる **1 エントリ**。どの節に入るかを 1 行目に HTML コメントで書く。\n    **形式は次の実例に合わせてください**（エントリは**ファイル中では 1 行**で、\n    下で折り返して見えるのは表示上の都合です）:\n\n    ```markdown\n    <!-- ### Fixed -->\n    - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた。\n    ```\n\n    - `- **` で始めること（集計は `grep -cE '^- \\*\\*'`）\n    - `(#2109)` は要約の**外**（`**` を閉じた後）に置くこと\n    - `<type>` は CLAUDE.md の規約語彙（`feat` / `fix` / `docs` / `refactor` / `test` / `chore` / `ci` / `style`）\n    - 1 エントリ＝1 行（折らない）\n  - `dev-reports/module-reference/issue-2109.md` — `docs/module-reference.md` の表に足す注記を\n    **行キー（`| \\`path\\` |`）ごと**に列挙する。**既存行に足すときは\n    `grep -n '^| \\`<path>\\`' docs/module-reference.md` を実行し、その出力（行番号つきの行キー）を\n    断片に書き写してから**書くこと。**0 件だった行への追記を指示しないでください**\n    （0 件なら「行が無いので追記指示は出さない」と書けばよい）。実例:\n\n    ```markdown\n    ## 既存行への追記\n    - `src/lib/foo/bar.ts` — 実在確認: `docs/module-reference.md:NNN`\n      追記内容: 「…（Issue #2109）」\n\n    ## 新規行\n    追記なし\n    ```\n- 断片が無いとリリースノートと module-reference に載りません。**実装と同じ commit の時点で書くこと。**\n- 完了したら `IMPL_COMPLETED` と出力してください。"
scope:
  allow:
  - src/components/worktree/OpencodeSessionControls.tsx
  - src/components/worktree/MessageInput.tsx
  - locales/**
  - tests/unit/**
  - tests/integration/**
  deny: []
success:
  requireWorkEvidence: true
  requireScopeClean: true
