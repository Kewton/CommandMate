# cm-06 — Approve from your phone (Issue #1811).
#
# The mobile take is filmed at 390x844 regardless of --viewport: MobilePromptSheet
# is not rendered at all above 768px, so a desktop-width take would film the
# inline panel and the caption would be describing a screen nobody saw.

version: 1
duration: 20
output: cm-06-approve-from-phone
scenes:
  - id: send-and-generate
    type: record
    duration: 11
    viewport: pc
    telop:
      ja: "作業を依頼して離席する"
      en: "Send the task and leave your desk."
  - id: respond-from-mobile
    type: record
    duration: 7
    viewport: mobile
    telop:
      ja: "承認はスマホでワンタップ"
      en: "Approve with one tap on your phone."
  - id: outro
    type: card
    duration: 2
    telop: { ja: "github.com/Kewton/CommandMate", en: "github.com/Kewton/CommandMate" }
