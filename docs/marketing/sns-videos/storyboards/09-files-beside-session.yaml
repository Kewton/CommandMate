version: 1
duration: 20
output: cm-09-files-beside-session
scenes:
  - id: title
    type: card
    duration: 3
    telop:
      ja: "差分を見るためにIDEを開く？"
      en: "Opening an IDE just to read a diff?"
  - id: sessions-overview
    type: record
    duration: 3
    viewport: pc
    telop:
      ja: "worktreeの中身も同じ画面"
      en: "Worktree files on the same screen"
  - id: send-and-generate
    type: record
    duration: 8
    viewport: pc
    telop:
      ja: "ファイルツリーが隣にある"
      en: "The file tree sits right there"
  - id: respond-from-mobile
    type: record
    duration: 2
    viewport: mobile
    telop:
      ja: "スマホからでも辿れる"
      en: "Browse it from your phone too"
  - id: complete
    type: record
    duration: 2
    telop:
      ja: "IDEを開かず確認する"
      en: "Check without opening an IDE"
  - id: outro
    type: card
    duration: 2
    telop:
      ja: "github.com/Kewton/CommandMate"
      en: "github.com/Kewton/CommandMate"
