version: 1
duration: 20
output: cm-08-tmux-in-browser
scenes:
  - id: sessions-overview
    type: record
    duration: 4
    viewport: pc
    telop:
      ja: "tmux を捨てなくていい"
      en: "You never give up tmux"
  - id: send-and-generate
    type: record
    duration: 10
    viewport: pc
    telop:
      ja: "端末がそのままブラウザに"
      en: "Your terminal, in the browser"
  - id: respond-from-mobile
    type: record
    duration: 2
    viewport: mobile
    telop:
      ja: "生ログをそのまま見る"
      en: "Read the raw output"
  - id: complete
    type: record
    duration: 3
    telop:
      ja: "既存の環境の上に載る"
      en: "It sits on your setup"
  - id: outro
    type: card
    duration: 1
    telop:
      ja: "github.com/Kewton/CommandMate"
      en: "github.com/Kewton/CommandMate"
