version: 1
title: 'Issue #2051: opencode セッションの共有リンクと export --sanitize の添付'
goal: "/pm-auto-issue2dev 2051\n\nIssue: https://github.com/Kewton/CommandMate/issues/2051\nEpic #2055 Phase 4。設計書の記録先は\n`docs/design/opencode-server-live-verification.md` の **`## 23. Issue 2051: …`**\n（§24 は並列で走る #2052、§25 は並列で走る #2054 が使う）。\n\n## オーケストレーターがコードで裏取りした事実\n\n- 依存の P1-5（sessionID 保持＝ #2038）は **CLOSED**。`-s <id>` の経路は既にあります。\n- **`/share` `/unshare` `/export` は設計書に 1 行も実測がありません。**完全に新規領域です\n  （`grep` 済み。`~/.local/share/opencode` の \"share\" は別物）。ルートの綴り・body・\n  レスポンス形はすべて `GET /doc` と実測で確かめてください。**Issue 本文の綴りも未検証です。**\n- `GET /config` の `share` キーの取りうる値も未実測です。Issue は `share: disabled` と書いていますが、\n  それが実際の綴りかは確かめてください。\n\n## 外部公開の安全規則（絶対に守ること）\n\n`POST /session/:id/share` は **会話を opncd.ai に公開します。** 利用者の認証情報で、\n第三者が読める URL が発行されます。**ユーザーの承認を得たうえで、次の条件つきで**実測してください。\n\n- **公開してよいのは、この検証のために作った使い捨てセッションだけです。**\n  §4 の隔離 HOME の中で新規セッションを作り、本文は**無意味なマーカー 1 行だけ**にすること\n  （例: `SHARE-PROBE-2051-<ランダム英数字>` とだけ送り、それに対する短い返答 1 件）。\n- **リポジトリの内容・ファイルパス・ユーザー名・環境変数・その他の実データを 1 文字も入れないこと。**\n  エージェントにファイルを読ませない。ツールを呼ばせない。\n- **既存のセッションを share しないこと。**ユーザーの実セッション（`~/.local/share/opencode/opencode.db`）\n  には触れません（§4 の HOME 差し替えでそもそも見えないはずですが、明示します）。\n- **発行したら直ちに取り消し、404 になることを確認してから次へ進むこと。**\n  検証の最後に「公開したものが 1 つも残っていない」ことを確かめ、§23 に書いてください。\n- 取り消しに失敗したら、**そこで止めて**その事実を §23 と commit に書いてください。\n  公開したまま放置しないこと。\n\n## 実装内容\n\n1. opencode 限定の「共有リンクを発行」ボタン。**外部公開なので確認ダイアログ必須**\n   （「このリンクは第三者が読めます」と分かる文言にすること。i18n は `locales/{ja,en}` の両方）。\n2. `GET /config` の share 設定が無効なら**ボタンを出さない**（テストで固定）。\n3. `DELETE /session/:id/share` で取り消し。\n4. `opencode export --sanitize <sessionID>` の JSON を日次レポート（`src/lib/daily-summary-generator.ts`）と\n   `/create-pr` の添付候補にする。**`--sanitize` が実際に何を落とすのかを実測して §23 に書くこと** —\n   「sanitize と名前が付いているから安全」で通さないでください。落ちないものがあるなら、それを\n   添付候補にしてよいかは別の判断になります。\n\n## 触ってはいけないファイル（並列ワーカーの所有）\n\n並列で #2054 が走っており、**次のファイルは #2054 の所有**です:\n\n- `src/lib/hooks/sources/opencode/source.ts`\n- `src/lib/hooks/sources/opencode/subscription.ts`\n- `src/lib/session/current-output-builder.ts`\n- `src/cli/types/api-responses.ts`\n- `src/lib/session/worktree-status-helper.ts`\n- `src/components/worktree/WorktreeDetailSubComponents.tsx`\n- `src/components/worktree/AgentInstancesPane.tsx`\n\nあなたが触ってよいのは `src/lib/hooks/sources/opencode/client.ts`（**末尾に追記**する形。\n#2041 / #2042 / #2043 が同じやり方で衝突なく足しています）、新規 API ルート、\n`src/components/worktree/OpencodeSessionControls.tsx`、レポート / PR 添付まわりです。\n\n## 受入条件\n\n- `share` が無効な設定でボタンが出ない（テスト）。\n- 発行 → 取り消しでリンクが 404 になる（実機。上の安全規則の条件下で）。\n- `--sanitize` が落とすもの / 落とさないものが §23 に列挙されている。\n\n## 実機計測の安全規則（厳守）\n\nこの Issue は opencode 1.18.22 の実機計測が受入条件です。**手順は\n`docs/design/opencode-server-live-verification.md` §4「再現環境（ハーネス）」に完全に文書化\nされているので、まずそれを読み、そのとおりに再現してください。** 自分で新しい隔離方法を発明しないこと。\n\n§4 が明記している、破ると実害が出る点:\n\n- **`HOME` ごと差し替える。** opencode は `$HOME` から config（`~/.config/opencode`）・\n  state・データ（`~/.local/share/opencode`、**`opencode.db` を含む**）を解決し、\n  セッションを 1 回動かすだけで `opencode.db` に書き込みます。\n  HOME を差し替えないと**ユーザーの実データを汚します**。\n- **隔離できていることを `GET /path` で確認する。** 返る `home` / `state` / `config` /\n  `worktree` / `directory` が**すべて scratchpad 配下**であることを目視ではなく実際に確認すること。\n- **TUI のモデルピッカーを開かない。** opencode はピッカーで**既定モデルを書き換えます**\n  （Claude の `/model` overlay と同じ罠）。§4 のとおり config でモデルを固定し、\n  ピッカーは一度も開かないこと。\n- **`auth.json` は mode 600 で複製し、検証後に削除する。**\n\n加えて tmux について:\n\n- **実 tmux を触る検証は必ず `tmux -L <専用socket>` で行う。** `-L` / `-S` は `$TMUX` より優先されます。\n  あなたは tmux ペインの中で動いていて `$TMUX` が既定サーバを指しているため、フラグ無しの\n  `tmux` 呼び出しは全て**ユーザーの本番サーバ**に届きます。\n- **`kill-server` を `-L` 無しで書かない。** 後始末は `kill-session -t '=<name>:'`（完全一致）で。\n- **`TMUX_TMPDIR` を隔離手段に使わない。** `$TMUX` が設定されていると完全に無視されます。\n- **`bind-key` / `unbind-key` / `set-option -g` を既定サーバへ撃たない。**\n\n**いま他に 2 つのワーカーが並列で走っています。**既定 tmux サーバを壊すと巻き添えになります。\n\n## 計測できなかった場合\n\n隔離ハーネスが立ち上がらない、opencode が期待どおり動かない等で計測できなかったら、\n**推測で埋めないでください。** 「計測できなかった」ことと理由を設計書と commit に書き、\nコード側は計測に依存しない範囲だけを実装してください。\n**推測値を実測として記録するのが、この Issue で最も避けたい失敗です。**\n\n## 作業ルール（厳守）\n\n- **Issue 本文を書き戻さないでください。** Issue の管理はオーケストレーターが行います。\n  本文とコード／実機が食い違ったら**実測を正**とし、差異は commit メッセージと docblock に残してください。\n- **PR を作らないでください。** commit までで止めてください。\n- 作業は **単一 commit** にまとめてください。\n- 新規テストファイルは `-2051` の接尾辞をつけてください。\n- **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。\n  代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には入りません。\n  - `dev-reports/changelog/issue-2051.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま\n    貼れる **1 エントリ**。どの節に入るかを 1 行目に HTML コメントで書く。\n    **形式は次の実例に合わせてください**（エントリは**ファイル中では 1 行**で、\n    下で折り返して見えるのは表示上の都合です）:\n\n    ```markdown\n    <!-- ### Fixed -->\n    - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた。\n    ```\n\n    - `- **` で始めること（集計は `grep -cE '^- \\*\\*'`）\n    - `(#2051)` は要約の**外**（`**` を閉じた後）に置くこと\n    - `<type>` は CLAUDE.md の規約語彙（`feat` / `fix` / `docs` / `refactor` / `test` / `chore` / `ci` / `style`）\n    - 1 エントリ＝1 行（折らない）\n  - `dev-reports/module-reference/issue-2051.md` — `docs/module-reference.md` の表に足す注記を\n    **行キー（`| \\`path\\` |`）ごと**に列挙する。**既存行に足すときは\n    `grep -n '^| \\`<path>\\`' docs/module-reference.md` を実行し、その出力（行番号つきの行キー）を\n    断片に書き写してから**書くこと。**0 件だった行への追記を指示しないでください**\n    （0 件なら「行が無いので追記指示は出さない」と書けばよい）。実例:\n\n    ```markdown\n    ## 既存行への追記\n    - `src/lib/foo/bar.ts` — 実在確認: `docs/module-reference.md:NNN`\n      追記内容: 「…（Issue #2051）」\n\n    ## 新規行\n    追記なし\n    ```\n- 断片が無いとリリースノートと module-reference に載りません。**実装と同じ commit の時点で書くこと。**\n- 完了したら `IMPL_COMPLETED` と出力してください。"
scope:
  allow:
  - src/lib/hooks/sources/opencode/client.ts
  - src/app/api/worktrees/[id]/opencode/**
  - src/components/worktree/OpencodeSessionControls.tsx
  - src/lib/daily-summary-generator.ts
  - src/config/opencode-constants.ts
  - src/types/opencode-*.ts
  - .claude/commands/create-pr.md
  - locales/**
  - tests/unit/**
  - tests/integration/**
  - tests/fixtures/opencode-share-2051/**
  - docs/design/opencode-server-live-verification.md
  deny: []
success:
  requireWorkEvidence: true
  requireScopeClean: true
