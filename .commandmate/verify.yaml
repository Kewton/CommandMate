# .commandmate/verify.yaml — v1
# 仕様: docs/design/verification-config.md
# ランナー: .claude/skills/cmate-verify/scripts/verify-run.sh
#
# ゲートは CI（.github/workflows/ci-pr.yml）の lint / type-check / test-unit ジョブと
# 同じコマンドを宣言している。build は稼働サーバの足元で走らせると配信中の成果物を
# 壊すため、skipInPrimaryCheckout が守る linked worktree でのみ意味を持つ。
version: 1
gates:
  - id: lint
    command: "npm run lint"
    timeoutSec: 900
  - id: typecheck
    command: "npx tsc --noEmit"
    timeoutSec: 900
  - id: unit
    command: "npm run test:unit"
    timeoutSec: 3600
# e2e ゲートはここに**無い**。宣言したゲートは既定で毎回走るため（スキーマに「宣言はするが
# 既定では走らない」フラグは無い）、常設すると `wait --verify` の所要が 1 ワーカーあたり
# 5 分以上伸び、並列オーケストレーションの裁定時間に直結する（CI 実績 E2E 5m16s〜5m39s）。
# フル e2e は ci-pr.yml が PR ごとに回しており、verify ゲートはその複製ではない。
# 必要なときは以下を足すか、タスク契約の `verify.gates` に `e2e` を含める。ポートは
# playwright.config.ts が CM_WORKTREE_INDEX から導出するので、コマンド側に算術は要らない
# （Issue #1871。実機記録は docs/qa/1871-parallel-e2e-port-collision.md）。
#
#   - id: e2e
#     command: "npm run test:e2e"
#     timeoutSec: 1800
options:
  baseRef: origin/develop
  skipInPrimaryCheckout: true
  # 8192 では vitest の失敗サマリが途中で切れ、2 件の失敗のうち 1 件しか読めなかった。
  maxLogTailBytes: 32768
