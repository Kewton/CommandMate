# cm-08 — The terminal, in the browser (Issue #1811).
#
# One long send beat: the terminal pane is the subject, and it is on screen for
# the whole of that take. Cutting away to the overview twice would spend the cut
# on everything except the thing being claimed.

version: 1
duration: 20
output: cm-08-tmux-in-browser
scenes:
  - id: sessions-overview
    type: record
    duration: 3
    viewport: pc
    telop:
      ja: "tmux を捨てなくていい"
      en: "You never give up tmux."
  - id: send-and-generate
    type: record
    duration: 15
    viewport: pc
    telop:
      ja: "端末がそのままブラウザに"
      en: "Your terminal, in the browser."
  - id: outro
    type: card
    duration: 2
    telop: { ja: "github.com/Kewton/CommandMate", en: "github.com/Kewton/CommandMate" }
