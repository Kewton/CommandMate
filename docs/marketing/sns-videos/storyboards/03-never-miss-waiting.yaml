version: 1
duration: 20
output: cm-03-never-miss-waiting
scenes:
  - id: title
    type: card
    duration: 3
    telop:
      ja: "承認待ちで、何時間も止まっていた"
      en: "Stalled for hours, waiting on approval"
  - id: sessions-overview
    type: record
    duration: 4
    viewport: pc
    telop:
      ja: "待機中の件数が常に見える"
      en: "Waiting count, always visible"
  - id: send-and-generate
    type: record
    duration: 3
    viewport: pc
    telop:
      ja: "止まった瞬間に分かる"
      en: "Know the moment it stops"
  - id: respond-from-mobile
    type: record
    duration: 6
    viewport: mobile
    telop:
      ja: "その場で答えて再開"
      en: "Answer on the spot, resume"
  - id: complete
    type: record
    duration: 2
    telop:
      ja: "放置時間がゼロに"
      en: "No more idle hours"
  - id: outro
    type: card
    duration: 2
    telop:
      ja: "github.com/Kewton/CommandMate"
      en: "github.com/Kewton/CommandMate"
