# cm-09 — Files beside the session (Issue #1811).
#
# `review-diff` opens the Git activity and reads an uncommitted diff in the file
# pane, which is the screen this highlight has always claimed and never filmed.
# The send beat stays only as the establishing shot that the pane sits next to a
# live session.

version: 1
duration: 20
output: cm-09-files-beside-session
scenes:
  - id: send-and-generate
    type: record
    duration: 9
    viewport: pc
    telop:
      ja: "セッションはそのまま"
      en: "The session stays where it is."
  - id: review-diff
    type: record
    duration: 9
    viewport: pc
    telop:
      ja: "差分は隣のペインで読む"
      en: "Read the diff in the next pane."
  - id: outro
    type: card
    duration: 2
    telop: { ja: "github.com/Kewton/CommandMate", en: "github.com/Kewton/CommandMate" }
