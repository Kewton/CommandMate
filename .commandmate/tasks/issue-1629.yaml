version: 1
title: "Issue #1629: --instance codex を指定しても Claude Code のセッションが起動する"
goal: |
  /bug-fix

  https://github.com/Kewton/CommandMate/issues/1629 を修正する。

  ## 事象（実測済み・Epic #1585 の受入検証で発見）

  roster 上 `CLI_TOOL = codex` の instance を `send --instance codex` で指定しても、
  **起動するのは Claude Code のセッション**になる。

  ```
  $ commandmate instances demo-app-feature-greet-codex
  INSTANCE_ID  ALIAS   CLI_TOOL  RUNNING
  codex        Codex   codex     no

  $ commandmate send demo-app-feature-greet-codex --instance codex --contract …   # exit 0
  $ tmux ls | grep demo
  mcbd-claude-demo-app-feature-greet-codex-codex: 1 windows     ← claude が起動している

  $ commandmate task show 7a70d560-3734-4de1-b3e8-bc6b53640b40
  AGENT:     claude/codex
  ```

  `--agent codex` を使えば正しく `mcbd-codex-…` が起動する。実測全文:
  https://github.com/Kewton/CommandMate/issues/1585#issuecomment-5157476193

  ## オーケストレーターが裏取りした出発点（ここから先はあなたが検証する）

  `src/app/api/worktrees/[id]/send/route.ts:150`:

  ```ts
  const cliToolId = body.cliToolId || worktree.cliToolId || DEFAULT_CLI_TOOL;
  ```

  CLI ツールは `body.cliToolId`（= `--agent`）か worktree 既定からしか決まらず、
  **`body.instanceId` に対応する roster エントリの `cliTool` を引く経路が存在しない**。
  そのため `--instance codex` 単独だと `cliToolId` は worktree 既定（claude）のまま、
  セッション名だけ `-codex` サフィックスが付いて `mcbd-claude-<wt>-codex` になる。
  実測の症状と一致する。

  **ただしこれは静的な読みであり、実行時に別経路で上書きされていないかは未検証。**
  この Issue はオーケストレーター自身が書いたもので、**過去に自作 Issue の原因帰属が
  実際に外れた前例がある**（#1552）。コードで裏取りし、食い違ったら実測を正として
  コミットメッセージに明記すること。

  ## 設計上の判断が要る点

  - `--instance` だけ指定した場合、roster の `cliTool` を採用するのが自然だが、
    **roster に無い instance ID を渡すアドホック起動**（`--register` 無しの新規 instance）も
    既存機能として存在する。roster ヒット時のみ解決し、ミス時は現行どおり worktree 既定に
    落とすのか、エラーにするのかを決めること
  - `--agent` と `--instance` を**両方**指定して食い違う場合（例 `--agent claude --instance codex`
    で roster の codex が `cliTool=codex`）の優先順位を決め、ドキュメント化すること
  - **対になる経路も点検すること。** `send` を直したら `respond` / `capture` / `auto-yes` /
    `kill-session` など instanceId を受ける他の経路でも同じ取り違えが起きていないか確認する

  ## D-1 の扱い（今回は「結論を出す」までで、コード変更は禁止）

  送り先の指定フラグが command ごとに違う:

  | command | 指定 |
  |---|---|
  | `send` | `--agent codex` |
  | `wait` | `--instance codex`（`--agent` は `unknown option` で exit 1） |
  | `respond` / `capture` | `--agent codex`（`--instance` も可） |

  **`src/cli/commands/wait.ts` は #1628 のワーカーが専有しているため触らないこと。**
  フラグ体系を揃える提案は結論としてまとめ、コミットメッセージか `docs/` に書くだけにする。
  実際の統一は orchestrator が別 Issue に切る。

  ## 受入条件

  - [ ] `send --instance <id>` が roster の `CLI_TOOL` を解決し、その CLI ツールのセッションを
        起動することを**テストで固定**する
  - [ ] `task show` の `AGENT` が実際に起動した CLI ツールと一致することを確認する
  - [ ] `--instance` 単独 / `--agent` + `--instance` / roster に無い instance の 3 ケースについて
        優先順位を決め、テストで固定し、ドキュメント化する
  - [ ] `respond` / `capture` / `auto-yes` など instanceId を受ける他経路に同型の取り違えが無いか
        確認し、あれば併せて塞ぐ（無ければ「無い」ことを根拠つきで述べる）
  - [ ] D-1 について結論を出す（コード変更はしない）
  - [ ] `npm run lint` / `npx tsc --noEmit` / `npm run test:unit` が exit 0

  ## 検証の作り方（空振り禁止）

  修正後に緑になっただけでは「ガードが効いた」と「テストが空振り」の両方と整合する。
  **修正前のコードで赤くなることを実際に確認してから**緑にすること。確認方法をコミット
  メッセージに書くこと。

  ## 担当範囲の境界（厳守）

  - **`src/cli/commands/wait.ts` と `src/lib/detection/**` は触らないこと。**
    並行して #1628（Codex で wait の完了判定が先走る）のワーカーが担当している
  - 逆に **`src/cli/commands/send.ts` と send route はあなたの専有**。#1628 側には触らないよう指示済み

  ## tmux を触るときの安全則（厳守・違反すると全ワーカーが死ぬ）

  - **実 tmux を触る検証は必ず `tmux -L <専用socket>` で行う。** `-L` / `-S` は `$TMUX` より優先される。
    あなたは tmux ペインの中で動いていて `$TMUX` が既定サーバを指しているため、フラグ無しの
    `tmux` 呼び出しは全て**ユーザーの本番サーバ**に届く
  - **`kill-server` を `-L` 無しで書かない。** 後始末は `kill-session -t '=<name>:'`（完全一致）で行う
  - **`TMUX_TMPDIR` を隔離手段に使わない。** `$TMUX` が設定されていると完全に無視される。
    socket 引数を取らない本番コード（`src/lib/tmux/tmux.ts`）を動かすときは `process.env.TMUX` を
    私設サーバへ向け、**転送が効いていることをテスト内で assert する**
  - **`bind-key` / `unbind-key` / `set-option -g` を既定サーバへ撃たない**（サーバグローバル）
  - `tests/unit/config/tmux-live-test-safety.test.ts` が unit ゲートで上記を機械的に弾く。
    このガードを緩めたり除外したりしないこと
  - **本番の稼働セッションを実験台にしないこと。** セッション起動の実機確認をするなら
    使い捨ての worktree を作って、そこで `mcbd-*` を立てて確認し、名前完全一致で片付ける

  ## 作業ルール（厳守）

  - **PR を作らないこと。** ブランチにコミットするところまでが担当。PR は orchestrator が作る
  - コミットは論理単位で複数に分けてよい
  - `dev-reports/` 配下は **コミットしないこと**
  - `CHANGELOG.md` の Unreleased セクションに 1 行だけ追記する（他ワーカーと衝突するので最小限に）
  - **Issue 本文の記述はコードで裏取りすること。** 行番号や前提が実際と食い違ったら
    **実測を正**とし、食い違いをコミットメッセージに明記する
  - 完了したら最後に `IMPL_COMPLETED` とだけ出力する
