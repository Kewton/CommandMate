# cm-05 — Asynchronous execution (Issue #1811).
#
# Two beats only, so the cut reads as one continuous "send, leave, come back":
# an overview at the head would put a third screen between the send and the
# result it is claiming.

version: 1
duration: 20
output: cm-05-send-and-walk-away
scenes:
  - id: send-and-generate
    type: record
    duration: 13
    viewport: pc
    telop:
      ja: "メッセージを送るだけ"
      en: "Just send a message."
  - id: complete
    type: record
    duration: 5
    viewport: pc
    telop:
      ja: "戻ったら終わっている"
      en: "Come back to it finished."
  - id: outro
    type: card
    duration: 2
    telop: { ja: "github.com/Kewton/CommandMate", en: "github.com/Kewton/CommandMate" }
