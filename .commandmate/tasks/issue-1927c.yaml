    - "tests/unit/detection-copilot-generating-1885.test.ts"
    - "tests/unit/detection-help-overlay-1497.test.ts"
    - "tests/unit/detection-opencode-interrupt-1894.test.ts"
    - "tests/unit/lib/**"
    - "tests/unit/session/**"
    - "tests/unit/guards/**"
    - "tests/unit/skills/orchestrate-monitor/fixtures/**"
    - "tests/fixtures/**"
    - "tests/integration/**"
