    - "src/components/worktree/OpencodeQuickKeys.tsx"
    - "src/components/worktree/MobileTerminalTab.tsx"
    - "src/hooks/useOpencodeQuickKeysDisclosure.ts"
    - "src/config/**"
    - "tests/e2e/**"
    - "tests/unit/components/worktree/**"
    - "tests/unit/hooks/**"
    - "dev-reports/**"
  deny: []
success:
  requireWorkEvidence: true
  requireScopeClean: true
