autoYes:
  mode: allow-listed
  allowPromptTypes: [yes_no, multiple_choice]
  denyPatterns:
    - "rm -rf"
    - "git push"
    - "gh pr create"
    - "gh issue edit"
    - "kill-server"

success:
  requireWorkEvidence: true
  requireScopeClean: true
