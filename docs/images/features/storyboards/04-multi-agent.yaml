# cm-04 — Multi-agent support (Issue #1811).
#
# The agent tabs are on screen for the whole send beat, which is why that beat
# carries most of the cut. The act of switching tabs is still not filmed — there
# is no scene for it — and product-highlights keeps saying so.

version: 1
duration: 20
output: cm-04-multi-agent
scenes:
  - id: sessions-overview
    type: record
    duration: 5
    viewport: pc
    telop:
      ja: "エージェントは 1 つに絞らない"
      en: "Do not lock into one agent."
  - id: send-and-generate
    type: record
    duration: 13
    viewport: pc
    telop:
      ja: "Claude Code をそのまま動かす"
      en: "Run Claude Code as it is."
  - id: outro
    type: card
    duration: 2
    telop: { ja: "github.com/Kewton/CommandMate", en: "github.com/Kewton/CommandMate" }
