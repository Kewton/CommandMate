version: 1
title: "Issue #2274: feat(ui): チャット面のファイルパスのリンク化に語境界と存在確認を入れる（相対パスの途中から誤リンク）"
goal: |
  https://github.com/Kewton/CommandMate/issues/2274 を実装する。

  ## 事象
  本文中の`commandmate-skills/docs/uat/harness-pack-uat-report-template.md`のうち、後半の
  `/docs/uat/harness-pack-uat-report-template.md`だけがクリック可能なファイルリンクになる。リンク先は
  このworktreeに存在しないパスで、押しても開けない。前半`commandmate-skills`は素のテキストのまま残るので、
  1つのパスが2色に割れて見える。

  ## 根本原因
  - `src/lib/chat/chat-transcript-view.ts:182`の`FILE_PATH_REGEX = /(\/[^\s\n<>"']+\.[a-zA-Z0-9]+)/g`は
    「`/`で始まり拡張子で終わる」文字列を語境界なしに拾う。相対パスの途中の`/`からも一致する
  - `src/components/worktree/ConversationPairCard.tsx:78`に同じ正規表現のコピーがある
    （#2232の凍結で共有していない）
  - クリック時に存在確認をしていない（`onFilePathClick`はそのままファイルパネルを開こうとする）

  ## 修正方針
  1. 正規表現に左側の境界を足す。直前が行頭・空白・バッククォート・引用符・括弧のときだけ一致させる
     （`(?<=^|[\s\`"'(（])`）。相対パス`a/b/c.md`は先頭が`/`でないので拾わない
  2. 相対パスも扱いたい場合は、worktree直下からの相対（`docs/…md`）を別枝で拾い、`/`始まりと同じ扱いにする。
     判断は本Issueで決める
  3. クリック時に`GET /api/worktrees/:id/files`相当で存在を確認し、無ければトースト
     「このパスはworktreeにありません」を出して何も開かない
  4. `ConversationPairCard`側のコピーも同じ正規表現に揃える（#2232の凍結は「見た目を変えない」が趣旨で、
     リンク判定の是正は含めてよい）

  ## スコープ外
  - Markdownのリンク記法（`[text](path)`）の扱い
  - 行番号付きパス（`file.ts:12`）のジャンプ

  ## 既知の罠
  - lookbehindはSafariでも現行版は対応済みだが、対象ブラウザの要件を確認する。使えない場合は先読みなしで
    「直前1文字」を手動判定する
  - `ChatMarkdownBody`は`p`/`li`/`td`/`th`/`strong`/`em`の文字列子だけをlinkifyする
    （`src/components/worktree/ChatMessageBubble.tsx:217-226`）。`code`の中は対象外のまま
  - **並行して他ワーカーが関連ファイルを編集している**。`src/lib/chat/chat-transcript-view.ts`は
    Issue #2273が`buildChatTranscriptRows`（約131行）を編集する ／
    `src/components/worktree/ChatMessageBubble.tsx`はIssue #2272がThinkingチップ描画を編集する ／
    `src/components/worktree/ChatTranscript.tsx`はIssue #2283がマウント時scroll/FAB（約472-489行）を編集する。
    このIssueの担当は`handleFilePathClick`（約532-533行）とその近傍、および`FILE_PATH_REGEX`/
    `splitFilePathParts`（約182-199行）のみ。離れた関数には触れないこと。マージはオーケストレーターが担当する

  ## 受入基準（検証可能な形で満たすこと）
  - `splitFilePathParts`unit: `commandmate-skills/docs/uat/x.md`は1つのtext part（部分一致しない）。
    `/Users/a/b.ts`と`` \`/src/x.ts\` ``と`(/src/x.ts)`はpath part
  - クリック時の存在確認: 無いパスでトーストが出てパネルが開かない
  - `ConversationPairCard`の正規表現が同じ結果を返す（両方に同じfixture）
  - 変異注入: 境界を外すと部分一致のケースが赤になることを確認する
  - 他リポジトリのパスを含む返答で、途中からリンクにならない（手動検証）
  - worktree内の絶対パスはこれまでどおり開ける（手動検証）

  ## 作業ルール（厳守）
  - `CHANGELOG.md` と `docs/module-reference.md` を編集しないでください（scope外です）。
    代わりに次の2ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には入りません。
    - `dev-reports/changelog/issue-2274.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま貼れる1エントリ（先頭は `- **<type>(<scope>): …** (#2274): …`）。どの節（`### Added` 等）に入るかを1行目にコメントで書く。1エントリ＝1行（折らない）。`(#2274)` は要約の外に置く
    - `dev-reports/module-reference/issue-2274.md` — `docs/module-reference.md` の表に足す注記を行キー（`| \`path\` |`）ごとに列挙する。既存行に足すときは `grep -n '^| \`<path>\`' docs/module-reference.md` を実行し、その出力（行番号つきの行キー）を断片に書き写してから書くこと。足すものが無ければ「追記なし」の1行でよい
scope:
  allow:
    - "src/lib/chat/chat-transcript-view.ts"
    - "src/components/worktree/ConversationPairCard.tsx"
    - "src/components/worktree/ChatTranscript.tsx"
    - "src/components/worktree/ChatMessageBubble.tsx"
    - "src/app/api/worktrees/[id]/files/**"
    - "locales/en/worktree.json"
    - "locales/ja/worktree.json"
    - "tests/unit/components/worktree/**"
    - "tests/unit/lib/chat/**"
    - "dev-reports/**"
  deny: []
success:
  requireWorkEvidence: true
  requireScopeClean: true
