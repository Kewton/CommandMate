version: 1
duration: 20
output: cm-06-approve-from-phone
scenes:
  - id: title
    type: card
    duration: 3
    telop:
      ja: "承認のために席へ戻らない"
      en: "Never walk back to your desk to approve"
  - id: sessions-overview
    type: record
    duration: 3
    viewport: pc
    telop:
      ja: "外出中でも状況が見える"
      en: "See everything while you are out"
  - id: send-and-generate
    type: record
    duration: 4
    viewport: pc
    telop:
      ja: "必要なのはブラウザだけ"
      en: "Only your phone browser"
  - id: respond-from-mobile
    type: record
    duration: 6
    viewport: mobile
    telop:
      ja: "確認はワンタップ"
      en: "Approve with one tap"
  - id: complete
    type: record
    duration: 2
    telop:
      ja: "移動中に前へ進む"
      en: "Progress while you commute"
  - id: outro
    type: card
    duration: 2
    telop:
      ja: "github.com/Kewton/CommandMate"
      en: "github.com/Kewton/CommandMate"
