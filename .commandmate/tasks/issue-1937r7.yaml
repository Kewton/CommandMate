version: 1
title: "Issue #1937 R7: 既存 QR ログイン（#383 / QrCodeGenerator）を撤去する"
goal: |
  /pm-auto-issue2dev

  https://github.com/Kewton/CommandMate/issues/1937 の **Phase 1 のうち R7 だけ**を実装してください。

  ## 【最重要】範囲は R7 のみ

  設計方針書 `docs/design/remote-qr-pairing-1937.md`（develop にあります）の §12 が Phase 1 を
  R1〜R12 に割っています。R1・R4・R5・R6・R8 は**着地済み**（PR #2134 / #2135）。
  今回あなたが担当するのは **R7 だけ**です。

  - **R9（`commandmate remote` 本体）は別ワーカーが同時に実装しています。**
    `src/cli/**` を触らないでください（scope にも入れていません）。
  - **R2（Cloudflare Provider）も別ワーカーが同時に実装中です。** `src/lib/remote/**` を触らないでください。
  - **`src/hooks/useFragmentLogin.ts` を触らないでください。** R6 で着地済みで、`#token=` の受理は
    **1 リリース残す**決定です（§2.2）。撤去は Phase 2 であって今回ではありません。

  **設計方針書 §2 を必ず読んでから実装してください。** 決定 A（deprecate して撤去）の根拠がそこにあります。

  ---

  ## 撤去してよいと判断した根拠（§2.1 の実測。ここは調べ直さなくてよい）

  | 観点 | 実測 |
  |---|---|
  | 到達経路 | `/login` のみ。`src/app/login/page.tsx` が `<div className="hidden md:block">` で包む（**スマホ幅では表示されない**） |
  | その画面に留まれるか | `useAuthEnabled()` が false なら `window.location.href = '/'`。**既定構成では `/login` に留まれない** |
  | docs の案内 | **0 件**。`docs/**` と `README.md` の grep ヒットは `docs/module-reference.md` 1 行と `CLAUDE.md` のツリー 1 行のみ |
  | 公式のスマホ手順 | README FAQ は `CM_BIND=0.0.0.0` → `http://<PC-IP>:3000`。**QR ではない** |

  到達には (1) `--auth` を明示有効化し (2) 幅 768px 以上で `/login` を開き (3) URL とトークンを手で貼る、
  の 3 条件が要り、どれも docs に無い。**発見可能性が実質ゼロ**であり、利用者は定義上トークンを手元に
  持っています。

  ## 実装内容（§2.2 の Phase 1 行がそのまま作業指示です）

  1. **`src/components/auth/QrCodeGenerator.tsx` を削除**。
  2. **`tests/unit/components/QrCodeGenerator.test.tsx` を削除**（15 ケース）。
     このテストは「`#token=` にトークンを URL エンコードして埋めること」など**撤去対象の仕様そのものを
     固定している**ので、コンポーネントと同時にファイルごと消します。個別ケースを残そうとしないでください。
  3. **`src/app/login/page.tsx`** から `QrCodeGenerator` の `dynamic()` import と
     `hidden md:block` のブロックを削除。
  4. **`locales/{en,ja}/auth.json` から `login.qr.*` の 10 キーだけを削除**:
     `sectionTitle` / `urlLabel` / `urlPlaceholder` / `tokenLabel` / `tokenPlaceholder` /
     `securityNotice` / `showQrButton` / `hideQrButton` / `qrSecurityWarning` / `httpsWarning`

     **残す 3 キー**: `autoLoginError` / `tokenExpiredOrInvalid` / `rateLimited`。
     これらは `login/page.tsx` が `useFragmentLogin` のエラー表示に使っています。**消すと壊れます。**
     R6 で追加された `login.pairing.*` 系のキーも**残してください**。

  ## 受入条件

  - `QrCodeGenerator.tsx` と同テストが消えている。
  - `/login` が `QrCodeGenerator` を import していない（`grep` で 0 件になること。ただし
    **0 件は「消えた」の証明にはならない**ので、`login/page.tsx` のレンダリングテストで
    「QR 関連の UI が出ない」ことも固定してください）。
  - **残す 3 キー ＋ `login.pairing.*` が en / ja 両方に在り、`login/page.tsx` から実際に引かれる**
    ことがテストで固定されている。i18n キーの削除しすぎは lint でも tsc でも CI でも捕まりません。
  - `#token=` の受理は**残っている**（`useFragmentLogin` は無変更。deprecation 警告も残す）。
  - en と ja でキー集合が一致している（片方だけ消す事故を防ぐ）。

  ## 注意

  - i18n の辞書はリポジトリルートの `locales/{en,ja}` です。テストで next-intl をモックする場合、
    **モックがキー文字列をそのまま返す形だと補間 param の assert が偽 PASS になります**。
    キーの存在を見るなら実辞書を読んでください。

  ## 作業ルール（厳守）

  - **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。
    代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には入りません。

    - `dev-reports/changelog/issue-1937r7.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま
      貼れる **1 エントリ**（先頭は `- **<type>(<scope>): …** (#1937): …`）。どの節
      （`### Added` / `### Changed` / `### Fixed`）に入るかを 1 行目にコメントで書く。
      **形式は次の実例に合わせてください**（develop の `CHANGELOG.md` にある実エントリを丸ごと 1 本。
      エントリは**ファイル中では 1 行**で、下で折り返して見えるのは表示上の都合です）:

      ```markdown
      <!-- ### Fixed -->
      - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた（隔離サーバ実測 2026-08-22 / copilot 1.0.80: `send`→`wait` 5 回中 3 回が約 0.3 秒・`basis=scraper_ready`・成果物ゼロで exit 0）。保留は `PENDING_PROMPT_HOLD_MS`=60 秒で打ち切り、`--timeout` / `--stall-timeout` はそれより短ければ従来どおり優先される。
      ```

      - `- **` で始めること — 集計は `grep -cE '^- \*\*'` なので、外れるとエントリとして数えられません。
      - `(#1937)` は要約の**外**（`**` を閉じた後）に置くこと — `（Issue #1937）` を要約の中に埋めると
        機械的に取り出せません。
      - `<type>` は CLAUDE.md のコミットメッセージ規約と同じ語彙
        （`feat` / `fix` / `docs` / `refactor` / `test` / `chore` / `ci` / `style`）。
      - 1 エントリ＝1 行（折らない）。本文がどれだけ長くても改行を入れません。

    - `dev-reports/module-reference/issue-1937r7.md` — `docs/module-reference.md` の表に足す注記を
      **行キー（`| \`path\` |`）ごと**に列挙する。既存行への追記なら「どの行に何を足すか」を書く。
      **既存行に足すときは `grep -n '^| \`<path>\`' docs/module-reference.md` を実行し、その出力
      （行番号つきの行キー）を断片に書き写してから**書くこと。0 件だった行への追記を指示しない
      （新しい行を足すなら「新規行」と明記する）。足すものが無ければ「追記なし」の 1 行でよい。実例:

      ```markdown
      ## 既存行への追記
      - `src/lib/session/worktree-status-helper.ts` — 実在確認: `docs/module-reference.md:103`（行番号は確認時点のもの）
        追記内容: 「private `getStatusCaptureLines()` を削除し `resolveCaptureSpec(cliToolId).statusLines` に置換（Issue #1933）」

      ## 新規行
      追記なし
      ```

    断片が無いとリリースノートと module-reference に載りません。**実装と同じ commit の時点で書くこと。**

  - **PR を作らないでください。** PR 作成とマージはオーケストレーターが行います。
  - **commit は 1 本にまとめてください**（`<type>(<scope>): <subject>` 形式）。
  - Issue 本文を書き換えないでください。訂正が要る場合は commit メッセージか PR 用のメモに書いてください。
  - 実装が終わったら最後に `IMPL_COMPLETED` とだけ出力してください。

