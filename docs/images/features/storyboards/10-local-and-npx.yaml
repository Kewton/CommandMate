version: 1
duration: 20
output: cm-10-local-and-npx
scenes:
  - id: title
    type: card
    duration: 3
    telop:
      ja: "クラウドにもアカウントにも預けない"
      en: "No cloud, no account, no relay"
  - id: sessions-overview
    type: record
    duration: 4
    viewport: pc
    telop:
      ja: "動くのは手元のマシン"
      en: "It runs on your own machine"
  - id: send-and-generate
    type: record
    duration: 6
    viewport: pc
    telop:
      ja: "セッションはローカル"
      en: "Sessions stay local"
  - id: respond-from-mobile
    type: record
    duration: 3
    viewport: mobile
    telop:
      ja: "スマホからも直接つなぐ"
      en: "Your phone connects directly"
  - id: complete
    type: record
    duration: 3
    telop:
      ja: "MITライセンスのOSS"
      en: "Open source, MIT licensed"
  - id: outro
    type: card
    duration: 1
    telop:
      ja: "npx commandmate@latest で60秒"
      en: "npx commandmate@latest, running in 60 seconds"
