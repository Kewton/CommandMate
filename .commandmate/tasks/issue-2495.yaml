title: "Issue #2495: LP（website/index.html）を orchestrate 軸へ"
goal: |
  https://github.com/Kewton/CommandMate/issues/2495 を実装してください。
  `/pm-auto-issue2dev` ワークフローで着手すること。**節の順序・文言・受入条件は Issue 本文に
  全て書かれています。必ず最初に読んでください**:
    gh issue view 2495 --repo Kewton/CommandMate

  ## 前提（満たされています）
  親 Issue #2493（public-messaging の改訂）は **develop にマージ済み**（PR #2515、
  commit 1d0f0d9c）。この worktree の `docs/design/public-messaging.md` は改訂後の版です。

  ## 最重要の原則
  **文言は `docs/design/public-messaging.md` からコピーする。言い換えない。**

  - `<h1>`: `One agent leads. Gates decide what's done.`
  - lede は #2493 §1 の 2 文
  - 事実行: `Open source (MIT) · runs on your machine · macOS / Linux / Windows (WSL2) · no app to install`
  - 4 カードの順と題・1 文、Problem 節の 4 行 + 1 行、What it does not do の 5 行も同文書から逐語

  ## 実装仕様

  ### Hero
  - `<h1>` を新 H1 に
  - lede を #2493 §1 の 2 文に
  - 定義文の `<p class="definition">` は **hero から外し Philosophy 節へ移す**
    （`def:en` マーカーの逐語一致テストは Philosophy 節で満たす）
  - 事実行を install の直下に
  - **loop SVG は残す**（契約 → 走る → 判定の図はそのまま差分の説明）。hero 予算（100KB）は変えない
  - `<title>` を `CommandMate — One agent leads. Gates decide what's done.`、`og:title` 同じ、
    `og:description` / `description` を lede の 1 文目に

  ### Problem 節（新設、hero 直下）
  #2493 §1b の 4 行 + 1 行。短く。

  ### See it running（**The loop より上へ移動**。順序は下記）
  1. **06 の run**: `website/assets/media/` へ新規追加する clip。素材は
     `workspace/market/posts/06-command-code-orchestrate/clip.mp4`
     （1,007,180 bytes ≒ 0.96MB、1080²、15 秒。`workspace/` は .gitignore 対象なので、
     `website/assets/media/` へコピーして**コミットする**）。
     キャプション: `One message to Command Code. Four issues, four workers, 4/4 gates, then UAT.`
     — **映っていることだけ**を書き、撮影記録
     （`workspace/market/posts/06-command-code-orchestrate/brief.md`）と突合すること。
  2. デモ 2（gate と exit code = `contract-verify.mp4`）
  3. デモ 1（契約を渡す = `install-skill.mp4` 系。§5 の対応表で確認）
  4. デモ 3（worktree ごとに並列 = `parallel-worktrees.mp4`）
  5. デモ 4（入力待ちがスマホへ = `never-miss-waiting.mp4`）

  既存 4 本は `website/assets/media/` にあります。mp4 のまま（LP は `<video>` 可）。
  **どのファイルがどのデモかは `docs/design/public-messaging.md` §5 の対応表で確認**して
  ください（#2493 で対応表の番号が付け替わっています）。

  ### The loop
  現行のまま。

  ### What it gives you（4 カード）
  #2493 §3 の順序と題: One agent leads ／ Verified, not vibe-checked ／
  Know which one needs you ／ Method as a system。1 文も同文書から。

  ### With and without CommandMate
  現行のまま（左列「Vibe coding」は foil として残す）。

  ### What it does not do（新設、With / Without の直後）
  #2493 の 5 行。

  ### Philosophy（新設、footer の上）
  `From vibe coding to Vibe Engineering` の見出し、定義文（`def:en` の逐語）、一節、
  Willison 脚注（現行の脚注をここへ移す）。

  ### Footer
  タグラインは現行維持。

  ### テスト（`tests/unit/website/landing-page.test.ts`）
  - `<h1>From vibe coding to Vibe Engineering.</h1>` の期待を**新 H1** に
  - `def:en` の逐語一致は Philosophy 節で満たすので変更不要
  - hero 予算（`HERO_BUDGET_BYTES`）は変えない
  - カード 4 枚とデモ 4 本のキャプションが public-messaging §3 / §5 と一致することを見るテストが
    あれば、番号の付け替えに追従させる

  ## 受入条件
  - [ ] h1 / title / og が新 H1 と lede で、旧 H1 は Philosophy 節の見出しにだけある
  - [ ] Problem 節、What it does not do、Philosophy 節がある
  - [ ] See it running が The loop より上にあり、先頭が 06 の run の clip
  - [ ] 4 カードの順と題が README と一致（README は並行する #2494 が作業中。
        **突き合わせ先は `docs/design/public-messaging.md` §3** とすること）
  - [ ] 禁止語 0（`control plane` / `control layer` / 競合名）、「your orchestrator」「24/7」
        「loop」（The loop の節名は除く）「orchestrate with any agent as the lead」が無い
  - [ ] `npm run test:unit` 緑（landing-page のテスト更新を含む）
  - [ ] GitHub Pages で表示確認（light / dark、スマホ幅）
        — 実機の Pages 反映はマージ後になるため、**ローカルで `website/index.html` を開いて
        light / dark とスマホ幅（〜400px）を確認**し、その結果を進捗報告に書けばよい
  - [ ] CHANGELOG `[Unreleased]` に docs として 1 行（断片で。下記「作業ルール」参照）

  ## スコープ外
  README（`README.md` / `docs/ja/README.md` — 並行する #2494 が担当。**触らないこと**）、
  tutorial、`docs/concept.md`、新規の収録・LP デモ 4 本の撮り直し。

  ## 並行作業の注意
  #2494（README）が同時に走っています。あちらは `README.md` / `docs/ja/README.md` /
  `tests/unit/docs/public-messaging.test.ts` / `docs/images/**` を触ります。
  `tests/unit/docs/public-messaging.test.ts` の定数（`HERO_H1_*` / `AXIS_*`）は
  **あちらが変更します**。`landing-page.test.ts` は自分でファイルを読む独立したテストなので
  影響はありませんが、**`tests/unit/docs/public-messaging.test.ts` は触らないでください**。

  ## 作業ルール（厳守）
  - **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。
    代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には
    入りません。
    - `dev-reports/changelog/issue-2495.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま
      貼れる **1 エントリ**（先頭は `- **<type>(<scope>): …** (#2495): …`）。どの節
      （`### Added` / `### Changed` / `### Fixed`）に入るかを 1 行目にコメントで書く。
      形式は次の実例に合わせてください（エントリは**ファイル中では 1 行**）:

      ```markdown
      <!-- ### Changed -->
      - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた（隔離サーバ実測 2026-08-22 / copilot 1.0.80: `send`→`wait` 5 回中 3 回が約 0.3 秒・`basis=scraper_ready`・成果物ゼロで exit 0）。**hook を出さないツールは挙動不変**。保留は `PENDING_PROMPT_HOLD_MS`=60 秒で打ち切り、`--timeout` / `--stall-timeout` はそれより短ければ従来どおり優先される。
      ```

      - `- **` で始めること（`grep -cE '^- \*\*'` で数える）。
      - `(#2495)` は要約の**外**（`**` を閉じた後）に置くこと。
      - `<type>` は CLAUDE.md の規約と同じ語彙。今回は `docs` または `feat`。
      - 1 エントリ＝1 行（折らない）。
    - `dev-reports/module-reference/issue-2495.md` — `docs/module-reference.md` の表に足す
      注記を**行キー（`| \`path\` |`）ごと**に列挙する。既存行に足すときは
      `grep -n '^| \`<path>\`' docs/module-reference.md` を実行し、その出力（行番号つきの
      行キー）を断片に書き写してから書くこと。0 件だった行への追記を指示しない。
      足すものが無ければ「追記なし」の 1 行でよい（その場合も 0 件だった grep を記録する）。
  - 断片が無いとリリースノートに載らない。実装と同じ commit の時点で書くこと。
