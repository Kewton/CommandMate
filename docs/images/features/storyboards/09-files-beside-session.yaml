version: 1
duration: 20
output: cm-09-files-beside-session
scenes:
  - id: sessions-overview
    type: record
    duration: 4
    viewport: pc
    telop:
      ja: "差分のためにIDEを開かない"
      en: "No IDE just to read a diff"
  - id: send-and-generate
    type: record
    duration: 10
    viewport: pc
    telop:
      ja: "ファイルツリーが隣にある"
      en: "The file tree sits right there"
  - id: respond-from-mobile
    type: record
    duration: 2
    viewport: mobile
    telop:
      ja: "スマホからでも辿れる"
      en: "Browse it from your phone"
  - id: complete
    type: record
    duration: 3
    telop:
      ja: "worktreeの中身も同じ画面"
      en: "Worktree files, same screen"
  - id: outro
    type: card
    duration: 1
    telop:
      ja: "github.com/Kewton/CommandMate"
      en: "github.com/Kewton/CommandMate"
