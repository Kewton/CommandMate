version: 1
title: "Issue #1985: 実シェルの 30s サブプロセスガードの妥当範囲を宣言し直す"
goal: |

  https://github.com/Kewton/CommandMate/issues/1985 を実装してください。

  #1950 が入れた `REAL_SHELL_SUBPROCESS_TIMEOUT_MS = 30_000`（`tests/helpers/real-shell-budget.ts`）は
  「1 台で 2 本のフル `npm run test:unit` を同時に回す」条件には小さい、というのが本 Issue です。

  **ガードの機構に欠陥はありません。** 残っているのは**そのサイズの妥当範囲の宣言**です。
  #1950 が根拠にした「負荷下 p99.9 = 16.5s に対する約 1.8 倍」の p99.9 は、
  **「同時フル実行 1 本」の条件で測られたもの**でした。

  ## 本文の「検討事項」3 点。**推奨は 1 を先に決めること**

  1. **`mutex: cpu.heavy` は verify 同士しか直列化しない**（#1917）。ワーカーが手で回すフル
     `test:unit` はその外側にある。**運用規約で「同時に N 本まで」とするか、機構で防ぐか**を先に決める。
  2. サイズを上げる場合、**何本の同時実行まで守るのかを宣言し、その条件で p99.9 を測り直す**こと。
     **数字だけ大きくするのは #1950 が退けたアンチパターン**です。
  3. 「同時実行を検出したら guard を緩める / skip する」形は、**裁定が環境で変わる**ので慎重に。

  ## 【重要】測定条件について

  **あなた自身が測定条件を作ってください。** 本 Issue の測定は「宣言した本数の同時フル実行」を
  再現することであって、静かなマシンで測ることではありません。ただし**他の並列ワーカーの
  verify ゲートが走ると測定値が汚染されます**。測定の直前に `ps -eo pid,command | grep vitest` で
  自分以外の vitest が居ないことを確認し、**居たら待ってから測ってください**。
  測定時の `uptime` の load average を記録に残すこと。

  ## 受入条件（本文より）

  - 「何本の同時フル実行まで守るのか」が `tests/helpers/real-shell-budget.ts` に**根拠つきで宣言**されている
  - その条件下で実測した p99.9 と、採ったガード値の比が書かれている
  - **宣言した本数で連続 3 回のフル実行が緑**
  - 変異注入で、変更後のガードが空振りでないことを示す

  ## この Issue だけの例外

  作業ルールの「フル `npm run test:unit` を手で回さない」は、**本 Issue には適用されません**
  （測定そのものが目的のため）。ただし上記のとおり他ワーカーの vitest が居ないことを確認してから回すこと。

  ## 作業ルール（厳守）

  - **Issue 本文の主張はコードで裏取りし、食い違えば実測を正とし**、commit message の
    「下調べとの食い違い」節に書いてください。**grep の 0 件は「存在しない」の証拠になりません** —
    陽性対照を撃ってから 0 件を信じてください。
  - **実 tmux を触る検証は必ず `tmux -L <専用socket>` で。** `-L` は `$TMUX` より優先されます。
    あなたは tmux ペインの中で動いていて `$TMUX` が既定サーバを指しているため、フラグ無しの
    `tmux` はユーザーの本番サーバに届きます。`kill-server` を `-L` 無しで書かない。
    `TMUX_TMPDIR` を隔離手段に使わない。`bind-key` / `set-option -g` を既定サーバへ撃たない。
  - **ポート 3000 は本番サーバです。触らないでください。** 開発サーバが要るなら別ポート＋
    `CM_DB_PATH` を `$HOME` 配下の使い捨てに。このシェルは `NODE_ENV=production` を export
    しているので `NODE_ENV=development` を明示すること。停止は明示 PID を kill（広域 `pkill -f` 禁止）。
  - **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外）。代わりに:
    - `dev-reports/changelog/issue-1985.md` — 1 行目に `<!-- ### Fixed -->` 等の節コメント、
      2 行目に **1 エントリ 1 行**で `- **<type>(<scope>): <要約>** (#1985): <本文>`。
      `(#1985)` は太字の**外側**、改行なし、`- **` で始める。
    - `dev-reports/module-reference/issue-1985.md` — 行キーごとの追記指示。既存行に足すときは
      **`grep -n` で行キーの実在を確認し、その出力（行番号つきの行キー）を断片に書き写してから**書くこと。
      0 件だった行への追記を指示しない（新規行なら「新規行」と明記）。
  - **変異注入で空振り緑を反証してください。** 各変異を 1 つずつ入れて対象テストのみ実行し、
    元に戻して再確認。結果を commit message に表で。
  - commit は単一。**PR は作らないでください**（私が作ります）。
  - commit message に「意図的な逸脱」「下調べとの食い違い」「変異注入」の節を必ず入れてください。
  - 完了したら最後に `IMPL_COMPLETED` とだけ出力してください。
scope:
  allow:
    - "tests/helpers/**"
    - "tests/unit/**"
    - "tests/integration/**"
    - "src/config/**"
    - "scripts/**"
    - ".commandmate/verify.yaml"
    - "docs/**"
    - "dev-reports/changelog/**"
    - "dev-reports/module-reference/**"
  deny:
    - "src/lib/session/current-output-builder.ts"
    - "src/cli/commands/wait.ts"
verify:
  gates: [token-discipline, control-chars, claudemd-size, route-exports, build-cli, build-server, lint, build, typecheck, integration, unit]
autoYes:
  mode: allow-listed
  allowPromptTypes: [yes_no, multiple_choice]
  denyPatterns: []
success:
  requireWorkEvidence: true
  requireScopeClean: true
