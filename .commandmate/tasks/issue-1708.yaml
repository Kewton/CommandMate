version: 1
title: "Issue #1708: プロンプト検出すり抜けで auto-yes / wait exit 10 / 契約ポリシーが全て無効化される"
goal: |
  /bug-fix

  https://github.com/Kewton/CommandMate/issues/1708 を修正する。
  まず `gh issue view 1708 --repo Kewton/CommandMate` で本文を必ず読むこと。

  ## 事象（Issue 本文の要約）

  claude worker が権限プロンプト（`Bash command` / `This command requires approval` /
  `Do you want to proceed?` / `❯ 1. Yes` / `2. Yes, and don't ask again for: gh issue *` /
  `3. No` / `Esc to cancel · Tab to amend · ctrl+e to explain`）で停止していたのに、
  `capture --json` は `isPromptWaiting: false` / `promptData: null` /
  `isUnclassifiedActive: true` を返した。結果として Auto-Yes poller も
  `wait --on-prompt agent` の exit 10 も契約 `autoYes` ポリシーも一切発火せず、
  worker は 900 秒の timeout を無言で使い切った。`capture --prompts` にも残らない。

  ## 本 Issue の構造的な主張

  「検出層が唯一の入口」になっているため、そこをすり抜けると下流の安全機構が全て無効になる。
  よって **(A) 検出漏れ自体の修正** と **(B) 検出漏れ時の安全網** の両方を実装する。

  ---

  ## 作業 A: 検出漏れ自体の修正（証拠ドリブン。推測で触らない）

  ### A-0. まず再現する

  Issue 本文のテキストを**そのまま文字列配列にしたフィクスチャでは detectPrompt は成功する**
  ことをオーケストレーター側で確認済みである。つまり欠陥は「抽象的な形」ではなく
  **実 TUI キャプチャに現れる差分**の側にある。したがって最初にやるのは実キャプチャの採取である。

  使い捨ての claude セッションを **専用 tmux socket** で起動し、権限プロンプトを実際に出させて
  `tmux -L <専用socket> capture-pane -p -S -200` の生出力をファイルに保存すること。
  そのキャプチャを `stripAnsi` → `stripBoxDrawing` に通した文字列を
  `tests/unit/lib/detection/fixtures/` 配下に実データとして追加し、
  それを入力にしたテストで `detectPrompt` の挙動を実測する。

  ### A-1. 有力仮説（**検証対象であって結論ではない**）

  `src/lib/detection/tui-detection-frame.ts` の `normalizeTuiFrameForDetection`:

  - `CLAUDE_LOWER_INTERACTIVE_ANCHOR = /^\s*[>❯]\s*(?:\d{1,2}[.)])?|esc\s+to\s+interrupt|.../i`
    の第1選択肢は **先頭の空白を許す** (`^\s*[>❯]`)。
  - claude はプロンプトダイアログの**下**に composer ボックスを描画する。box drawing を
    剥がすと composer 行は `  > nudge text` のように**字下げされた `>`** になる。
  - すると `hasNewerInteractiveAnchor` が true になり、`lines.slice(footerIndex + 1)` により
    **フッターより上のダイアログ全体が捨てられる**（tui-detection-frame.ts:57-69）。
  - 一方 `status-detector.ts` の入力プロンプト判定 `CLAUDE_PROMPT_PATTERN = /^[>❯](\s*$|\s+\S)/m`
    は**列0固定**なので字下げされた `>` にはマッチしない。よって status は
    `running` / `DEFAULT` に落ち、`isUnclassifiedActive: true` になる。
    これは Issue が報告した3つの値（isPromptWaiting=false / promptData=null /
    isUnclassifiedActive=true）と完全に整合する。
  - 「同じ形でも検出される時とされない時がある」も、composer に文字が入っているか否かで説明できる。

  **この仮説を実キャプチャで裏取りすること。** 裏取りできたら修正する。
  裏取りできなければ **推測で `tui-detection-frame.ts` を書き換えないこと**。その場合は
  実測で分かった真の分岐点を特定して修正し、仮説が外れたことを PR 説明に明記する。
  Issue 本文の記述とコードの実測が食い違ったら**実測を正**とする。

  ### A-2. 修正の方向性（仮説が裏取りできた場合）

  composer 行（＝ユーザー入力欄）と「新しいフレームの選択肢行」を区別できるようにする。
  ダイアログのフッターの直下に来る composer は「より新しいフレーム」ではなく
  **同一フレームの一部**である。既存の #1676 / #1699 / #1495 の回帰テストを
  1件も壊さないこと（それらは全て同じファイル群を守っている）。

  ---

  ## 作業 B: 検出漏れ時の安全網（Issue の提案 1〜3。全て実装する）

  ### B-1. `isUnclassifiedActive` を `wait` の停止事由にする

  現状 `isUnclassifiedActive` は `src/lib/session/current-output-builder.ts:153` で算出され
  WS/HTTP ペイロードに載っているが、**`src/cli/types/api-responses.ts` の
  `CurrentOutputResponse` に型として存在せず**、`src/cli/commands/wait.ts` は一度も読まない。
  結果、分類できないダイアログは「無い」ものとして扱われ timeout まで放置される。

  - `CurrentOutputResponse` に `isUnclassifiedActive?: boolean` を追加する。
  - `wait.ts` に**滞留時間つき**の判定を足す。1ポーリングでも true になり得る値なので
    瞬間値で止めてはならない。`isUnclassifiedActive === true` が**連続して一定時間**
    （既定値を定数で定義し、根拠をコメント1行で残す）続いたときにのみ停止事由とする。
    途中で false になったら滞留カウンタをリセットする。
  - 停止時の挙動は **#1628 の `isSelectionListActive` の前例に揃える**（wait.ts:200-226）:
    `--on-prompt human` なら stderr に理由を出して待機継続、
    `--on-prompt agent`（既定）なら **exit 10 (`WaitExitCode.PROMPT_DETECTED`)** を返し、
    stdout の JSON に `type: 'unclassified'`（`selection_list` と同様の新しい定数）を載せる。
    **新しい exit code は作らない。** 既存の呼び出し側（`--auto-yes` runner 等）は
    exit 10 で分岐しているので、そこに新種別として乗せるほうが下流が壊れない。
  - `question` には「分類できない対話フレームが N 秒続いている」と分かる文字列を入れ、
    呼び出し側が生ペインを見に行けるようにする。

  ### B-2. 未分類ダイアログを `capture --prompts` に残す

  現状プロンプト履歴の書き込み口は2つだけで、**両方 `promptDetection.isPrompt === true` で
  ゲートされている**:
    1. `src/lib/polling/response-checker.ts:568-597`（pending プロンプト行）
    2. `recordAnsweredPrompt()` (`src/lib/db/chat-db.ts:674`) ←
       `src/lib/auto-yes-poller.ts:439` と
       `src/app/api/worktrees/[id]/prompt-response/route.ts:215` から

  よって検出できなかったフレームは**どこにも残らない**。B-1 で停止事由と判定した
  未分類フレームを、既存のプロンプト履歴から**判別可能な形で**記録すること
  （既存の `messageType: 'prompt'` 行と混ざって「検出できた」ように見えてはならない。
  `promptData` の型か `status` か、いずれかで未分類であることが読み取れるようにする）。
  `capture --prompts` の表示でも未分類であることが分かるようにする。

  記録は**重複してはならない**。同じ未分類フレームが滞留している間、ポーリングの度に
  行が増えないこと（既存の `generatePromptKey` / dedup の仕組みを踏襲する）。

  ⚠️ `src/lib/session/worktree-status-helper.ts:137-144` は `hasActivePrompt` が false のとき
  `markPendingPromptsAsAnswered()` を呼ぶ。未分類行がこれに巻き込まれて即座に
  「回答済み」にされないことを**テストで固定**すること。

  ### B-3. プロンプト表示中の `send` を拒否する

  プロンプトダイアログが開いている間に `send` すると、入力欄にテキストが積まれるだけで
  送信されず、その後の `respond` が「回答」ではなく「メッセージ」として送られる危険がある。

  - `send` 経路（`src/app/api/worktrees/[id]/send/` と `src/cli/commands/send.ts`）で、
    サーバがプロンプト待ちを報告している場合は**送信せず拒否**し、
    `respond` を使うよう促すメッセージを stderr に出す。exit code は既存の
    `ExitCode` から適切なものを選ぶ（新設しない）。
  - **`respond` / `special-keys` / `prompt-response` は拒否対象に含めないこと。**
    これらはプロンプトに答えるための経路であり、塞ぐと回答手段が無くなる。
  - 拒否は**検出できているときだけ**効く。検出できていないケースは B-1 が受け持つ。
    この非対称を PR 説明に明記すること。

  ---

  ## 作業ルール（厳守）

  - **実 tmux を触る検証は必ず `tmux -L <専用socket>` で行う。** `-L` / `-S` は `$TMUX` より
    優先される。あなたは tmux ペインの中で動いていて `$TMUX` が既定サーバを指しているため、
    フラグ無しの `tmux` 呼び出しは全て**ユーザーの本番サーバ**に届く。
  - **`kill-server` を `-L` 無しで書かない。** 後始末は `kill-session -t '=<name>:'`（完全一致）で行う。
  - **`TMUX_TMPDIR` を隔離手段に使わない。** `$TMUX` が設定されていると完全に無視される。
    socket 引数を取らない本番コード（`src/lib/tmux/tmux.ts`）を動かすときは `process.env.TMUX` を
    私設サーバへ向け、**転送が効いていることをテスト内で assert する**。
  - **`bind-key` / `unbind-key` / `set-option -g` を既定サーバへ撃たない。** サーバグローバルなので
    他の全セッションに波及する。
  - 使い捨て claude セッションを起動するときは、**update / trust プロンプトが入力を食う**ことに
    注意する。誤って `/model` などを送るとユーザーのグローバル設定を書き換える事故になる。
    設定を変更するコマンドは一切送らないこと。
  - `npm run build` は**走らせない**（稼働中サーバの成果物を壊す）。検証ゲートは
    lint / typecheck / unit のみ。
  - **単一コミットにまとめない。** 論理単位ごとにコミットしてよい。
  - **PR は作らない。** オーケストレーターが作る。
  - `dev-reports/` 配下の成果物はコミットしない。
  - CHANGELOG.md に1行追記すること。

  ## 完了条件

  - [ ] 実 TUI キャプチャ由来のフィクスチャが `tests/unit/lib/detection/fixtures/` に追加されている
  - [ ] 検出漏れの真の分岐点が実測で特定され、修正されている（または特定できなかった事実と
        調査内容が PR 説明に明記されている）
  - [ ] `wait` が滞留した `isUnclassifiedActive` で exit 10 (`type: 'unclassified'`) を返す
  - [ ] `--on-prompt human` では待機継続する
  - [ ] 未分類フレームが `capture --prompts` に判別可能な形で1行だけ残る（重複しない）
  - [ ] 未分類行が `markPendingPromptsAsAnswered()` に巻き込まれないことがテストで固定されている
  - [ ] プロンプト待ち中の `send` が拒否され、`respond` は拒否されない
  - [ ] 追加した各テストが**空振りしていない**ことを、修正を1つずつ戻す変異注入で確認済み
  - [ ] `npm run lint` / `npx tsc --noEmit` / `npm run test:unit` が全て通る
scope:
