# Tutorial Step 4 — parallel worktrees (Issue #1575)
#
# The worktree is created outside CommandMate — by git, by the agent's
# worktree-new skill — and CommandMate's part is to notice it. The cut is
# therefore "sync, then look at the result", not "create".

version: 1
duration: 12
output: cm-t4-parallel-worktrees
scenes:
  - id: sync-worktrees
    type: record
    duration: 6
    viewport: pc
    telop:
      ja: "外部で作った worktree を同期"
      en: "Sync a worktree made outside"
  - id: sessions-overview
    type: record
    duration: 6
    viewport: pc
    telop:
      ja: "ブランチごとに1セッション"
      en: "One session per branch"
