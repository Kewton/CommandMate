# cm-07 — Automatic completion detection (Issue #1811).
#
# Weighted towards the tail: the subject is the list going back to ready on its
# own, so `complete` gets a slot long enough to read rather than a closing beat.

version: 1
duration: 20
output: cm-07-completion-detected
scenes:
  - id: sessions-overview
    type: record
    duration: 4
    viewport: pc
    telop:
      ja: "終わったか見に行かない"
      en: "Stop checking whether it finished."
  - id: send-and-generate
    type: record
    duration: 9
    viewport: pc
    telop:
      ja: "実行中はそう見える"
      en: "Running looks like running."
  - id: complete
    type: record
    duration: 5
    viewport: pc
    telop:
      ja: "完了は自動で検知する"
      en: "Completion is detected for you."
  - id: outro
    type: card
    duration: 2
    telop: { ja: "github.com/Kewton/CommandMate", en: "github.com/Kewton/CommandMate" }
