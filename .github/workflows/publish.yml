# Publish to npm workflow
# Issue #96: npm install CLI support
# Uses npm Trusted Publishers (OIDC authentication)
# See: https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication and npm provenance

jobs:
  publish:
    # [self-hosted] Same expression every job in ci-pr.yml uses. This workflow is
    # only ever triggered by `release: [published]`, so the pull-request arm never
    # fires here — it is kept identical so the two files cannot drift into
    # different rules for "which runner".
    #
    # RISK, STATED. npm Trusted Publishers (OIDC) and `--provenance` were measured
    # on GitHub-hosted runners only; whether npm accepts a token minted on a
    # self-hosted runner has NOT been measured here. If it refuses, the job fails
    # BEFORE `npm publish` writes anything — nothing reaches the registry and the
    # published GitHub Release stays valid — and `gh run rerun --failed` retries
    # after a one-line revert of this block. The preflight below makes the
    # prerequisites fail by name instead of inside npm.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    environment: npm-publish  # Required: must match npm Trusted Publisher settings
    # [Issue #1830] This job publishes to npm, so a hang here leaves the release
    # state ambiguous — did the version go out or not? — on top of squatting a
    # runner for GitHub's 6-hour default. See the header of ci-pr.yml for the
    # incident behind this change.
    #
    # Measured 2026-08-19 over the 10 most recent successful runs of this
    # workflow (`gh run list --workflow publish.yml --limit 10 --json databaseId`
    # then `gh run view <id> --json jobs`):
    #
    #   publish   n=10   median 14.3m   max 16.0m
    #   (11.7 13.5 14.0 14.2 14.3 14.4 14.5 14.6 15.6 16.0)
    #
    # dominated by `Run tests` (10.4m median / 11.7m max — it is `npm run
    # test:unit`, the same suite the CI workflow caps at 30).
    #
    # 30 = `max x 2` under the same policy as ci-pr.yml. NOTE: Issue #1830 asked
    # for "20分程度" on the grounds that no measurement existed. It does exist,
    # and 20 is only 1.25x the observed max — close enough to cut a healthy
    # release. The measurement wins.
    timeout-minutes: 30
    steps:
      # [self-hosted] Toolchain and OIDC preflight, deliberately the FIRST step of
      # the only job that can publish. On a GitHub-hosted image node/npm/git are
      # guaranteed and ACTIONS_ID_TOKEN_REQUEST_URL is present whenever
      # `id-token: write` is set; on a self-hosted runner the image decides. Fail
      # here, by name, rather than inside `npm publish --provenance`.
      - name: Preflight the toolchain and the OIDC token endpoint
        run: |
          for tool in node npm git; do
            command -v "$tool" >/dev/null || { echo "::error::missing required tool: $tool"; exit 1; }
          done
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is unset — OIDC is unavailable, so npm Trusted Publishers and --provenance cannot work"
            exit 1
          fi
          node -v && npm -v
          echo "runner: ${RUNNER_NAME:-unknown} (${RUNNER_OS:-?}/${RUNNER_ARCH:-?})"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The steps below that fetch or push bytes over the network carry their own
      # caps, so a timed-out release says WHICH one stalled instead of only that
      # the job did. Sizes are from the same 10-run sample.
      - name: Upgrade npm for trusted publishing
        timeout-minutes: 5 # registry fetch of a single package; measured 0.03m max
        run: npm i -g npm@^11.5.1

      - name: Show versions
        run: node -v && npm -v

      - name: Install dependencies
        # Registry fetch; measured 0.41m median / 0.43m max (n=10). A cold-cache
        # `npm ci` of this lockfile (572 packages, empty --cache dir, lifecycle
        # scripts included) measured 7s locally, so 5 has ample headroom.
        timeout-minutes: 5
        run: npm ci

      - name: Security audit
        timeout-minutes: 5 # `npm audit` posts the tree to the registry; measured 0.03m max
        run: npm audit --audit-level=critical

      - name: Run tests
        run: npm run test:unit

      - name: Build Next.js
        run: npm run build

      - name: Build CLI
        run: npm run build:cli

      - name: Build server
        run: npm run build:server

      - name: Check package size
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          # Display package size information
          SIZE=$(grep "total files" pack-output.txt | grep -oE '[0-9]+(\.[0-9]+)?\s*(MB|kB)' || echo "0 kB")
          echo "Package size: $SIZE"

      - name: Publish to npm (OIDC)
        # Measured 1.46m median / 1.57m max (n=10), so 10 is ~6x the worst
        # observed publish. Cutting here does not create a half-published
        # version: the registry either accepts the tarball or it does not, and a
        # `npm publish` still hanging after 10 minutes was not going to land
        # anyway. Without a cap it would hang for 6 hours instead.
        timeout-minutes: 10
        run: npm publish --provenance --access public
