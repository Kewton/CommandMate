verify:
  gates: [token-discipline, control-chars, claudemd-size, route-exports, lint, typecheck, unit]
autoYes:
  mode: allow-listed
  allowPromptTypes: [yes_no, multiple_choice]
  denyPatterns: []
success:
  requireWorkEvidence: true
  requireScopeClean: true
