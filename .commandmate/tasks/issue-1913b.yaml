    - "locales/**"
    - "tests/unit/**"
    - "tests/integration/**"
    - "tests/helpers/**"
    - "docs/**"
    - "CHANGELOG.md"
    - ".commandmate/tasks/issue-1913.yaml"
    - ".commandmate/tasks/issue-1913b.yaml"
  deny: []


autoYes:
  mode: allow-listed
  allowPromptTypes: [yes_no, multiple_choice]
  denyPatterns:
    - "rm -rf"
    - "git push"
    - "gh pr create"
    - "gh issue edit"
    - "kill-server"

verify:
  gates: [lint, typecheck]

success:
  requireWorkEvidence: true
  requireScopeClean: true
