    - "src/lib/hooks/agent-event-service.ts"
    - "docs/design/codex-transcript-reader.md"
    - "tests/unit/hooks/**"
    - "tests/integration/stop-history-capture*.test.ts"
    - "dev-reports/changelog/issue-2398.md"
    - "dev-reports/module-reference/issue-2398.md"
  deny:
    - "src/lib/polling/response-checker.ts"
    - "src/lib/detection/cli-patterns.ts"
    - "src/lib/relay/relay-delivery.ts"
    - "src/lib/hooks/sources/codex/history.ts"
