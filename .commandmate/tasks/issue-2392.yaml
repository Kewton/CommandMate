    - "src/lib/history/user-turn-recorder.ts"
    - "src/lib/db/chat-db.ts"
    - "tests/unit/lib/history/**"
    - "tests/unit/lib/db/**"
    - "tests/unit/lib/relay/**"
    - "dev-reports/changelog/issue-2392.md"
    - "dev-reports/module-reference/issue-2392.md"
  deny:
    - "src/lib/relay/relay-service.ts"
    - "src/lib/relay/relay-delivery.ts"
