version: 1
title: "Issue #1909: auto-yes が claude 固定で worktree 既定のツールを対象にしない"
goal: |
  /bug-fix 1909

  https://github.com/Kewton/CommandMate/issues/1909 を修正してください。

  **重要: Issue 本文の 2 項目のうち「2. `send --model` の検証順序」は #1925（マージ済み）で
  既に修正されています。** `src/cli/commands/send.ts` の検証は解決後に移り、コメントにも
  「Issue #1925: judged against the RESOLVED agent, not against --agent」と入っています。
  **自分で実コードを確認し、本当に直っているなら再実装せず、確認した事実をコミットメッセージに
  書いてください。** 残りは項目 1 だけです。
  ## オーケストレーター契約（Issue 本文より優先・厳守）

  1. **PR を作成しない・push しない**（オーケストレーターが行います）。ブランチは checkout 済みです。
  2. 実装は**このブランチ上の単一 commit** にまとめる。メッセージは `<type>(<scope>): <要約> (#N)` 形式。
  3. commit に含めてよいのは `src/` `tests/` `docs/` `scripts/` `.eslintrc.json` `CHANGELOG.md`
     `.commandmate/tasks/issue-N.yaml` のみ。**`dev-reports/` は絶対に含めない**（CI の hygiene で落ちます）。
  4. `CHANGELOG.md` は `## [Unreleased]` に**自分の 1 行だけ**追加する。他の行を並べ替えない・消さない
     （並列ワーカーが同じ節を触っており、衝突解消はオーケストレーターが機械的に行います）。
  5. **GitHub の Issue / PR を編集しない**（`gh issue edit` 禁止）。Issue レビューのフェーズも実行しない。
     Issue 本文の誤りは**コミットメッセージの「意図的な逸脱」節**に書いて渡すこと。
  6. 完了したら最終行に `IMPL_COMPLETED` とだけ出力して停止する。

  ## 実装方針は「推奨」であって決定ではない

  Issue 本文と設計方針書の実装方針は**推奨**です。**必ず実コードで裏を取り、実測が食い違ったら
  実測を正とし、乖離をコミットメッセージに明記してください。** 過去に私（オーケストレーター）が
  書いた方針が 3 回連続でワーカーの実測に覆されています。逸脱報告は歓迎します。

  ## 正本ドキュメント

  - 設計方針書: `docs/design/multi-agent-state-architecture.md`（develop に着地済み、Stage 1-4 レビュー済み）。
    §4 D1〜D5 / §8 / §13.2 を正とする。**Issue 本文と方針書が食い違ったら方針書を正**とする。
  - Issue 本文中の設計方針書リンクが 404 になる場合は上のローカルパスを見ること。

  ## テスト実行のルール（重要・厳守）

  - **フル `npm run test:unit` を自分で回さないでください。** 並列ワーカーが同時にフル実行すると
    diff と無関係のテストが `Test timed out in 5000ms` で落ち、存在しない回帰を追いかけることになります
    （実測済み。#1917 で `verify.yaml` の unit ゲートに `mutex: cpu.heavy` を入れた理由がこれです）。
  - 自分が触った/追加したテストだけ `npx vitest run <path>` で確認する。
  - 全体の裁定はオーケストレーターが `commandmate wait --verify`（`.commandmate/verify.yaml` の全ゲート）
    で行います。どうしても全体を回したい場合のみ `.claude/skills/cmate-verify/scripts/verify-run.sh`
    （mutex 準拠）を使ってください。
  - **`npm run build` を実行しない**（稼働中サーバの配信成果物を壊します）。
  - `npm run lint` / `npx tsc --noEmit` は軽いので自由に回してよい。

  ## 環境ルール（厳守）

  - **稼働サーバ（port 3000）を停止・再起動しない。** 隣の `MyCodeBranchDesk` ディレクトリで何もしない。
  - 実 tmux を触る検証は必ず `tmux -L <専用socket>` で行う（`-L`/`-S` は `$TMUX` より優先）。
    フラグ無しの `tmux` は**ユーザーの本番セッション**に届きます。`kill-server` を `-L` 無しで打たない。
    後始末は `kill-session -t '=<name>:'`。`TMUX_TMPDIR` は隔離手段にならない（`$TMUX` があると無視）。
    `bind-key` / `unbind-key` / `set-option -g` を既定サーバへ撃たない。
  - 他の worktree（`../commandmate-issue-*`）に触らない。

  ## 完了条件

  Issue の受入条件をすべて満たし、`npm run lint` と `npx tsc --noEmit` が緑、追加したテストが
  単独実行で緑であること。**ガード/pin 系のテストは変異注入で赤になることを必ず確認**してください
  （空振り緑を作らない。確認手順と結果をコミットメッセージに書く）。

  ## この Issue 固有の注意

  - **#1925 の `resolveSessionTarget()` を使ってください**（自前の解決を書かない）。
    優先順位は roster > 明示指定 > primary anchor > worktree 既定 > 既定エージェント。
    `src/app/api/worktrees/[id]/auto-yes/route.ts` の `?? 'claude'` はこれで消えます。
  - **#1884（マージ済み）が current-output route で同じ置換をやっています。**
    その形（`resolvedBy` / `conflict` を additive で載せる・読み取り経路は 400 にしない）を
    参考にしてください。ただし auto-yes は**副作用のある経路**なので、矛盾時に
    `resolveSessionTargetStrict()` で 400 を返すかどうかは**あなたが決めて理由を書く**こと。
  - CLI 側（`src/cli/commands/auto-yes.ts`）は `--agent`/`--instance` 無しだと `cliToolId` を
    送っていません。`ls` と同じ解決になるよう、**サーバに委譲**してください（#1925 が
    `resolve-target` エンドポイントを用意しています）。
  - **`?? 'claude'` を新設しないこと。** #1923 がガードで baseline を固定します。
    現時点の実測は `src/app/api/**/route.ts` が 8 件です（#1884 で 9 → 8）。
    本 Issue でさらに減るはずなので、**減った実数をコミットメッセージに書いてください**。
  - **挙動変更なので CHANGELOG に明記**（auto-yes の既定ツールが claude 固定から
    worktree 既定へ変わる。方針書が挙げる「挙動変化 3 件」の 1 つ）。
  - 回帰は「`auto-yes <id> --enable` が worktree 既定ツールの poller を起動する」ことを
    exit code / 起動された cliToolId で pin してください。

scope:
  allow:
    - "src/app/api/**"
    - "src/cli/**"
    - "src/lib/session/**"
    - "src/lib/polling/**"
    - "src/lib/auto-yes-poller.ts"
    - "tests/unit/**"
    - "tests/integration/**"
    - "tests/helpers/**"
    - "docs/**"
    - "CHANGELOG.md"
    - ".commandmate/tasks/issue-1909.yaml"
  deny: []


autoYes:
  mode: allow-listed
  allowPromptTypes: [yes_no, multiple_choice]
  denyPatterns:
    - "rm -rf"
    - "git push"
    - "gh pr create"
    - "gh issue edit"
    - "kill-server"

success:
  requireWorkEvidence: true
  requireScopeClean: true
