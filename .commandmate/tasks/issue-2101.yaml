version: 1
title: 'Issue #2101: commandmate interrupt を追加する'
goal: "/pm-auto-issue2dev 2101\n\nIssue: https://github.com/Kewton/CommandMate/issues/2101\nEpic #2055 の**受入条件 1 の未達 2 件のうち 1 件**です（もう 1 件 #2100 は並列で走っています）。\n\n## この Issue はオーケストレーターが実機計測して切ったものです\n\nWeb 側（`POST /api/worktrees/:id/interrupt`）は 2026-08-26 の close-out UAT で\n実機を通してあります:\n\n```\n生成中 : sessionStatus=running isGenerating=True\nPOST /api/worktrees/uat2055oc/interrupt -> 200\n  {\"success\":true,\"message\":\"Interrupt sent to 1 session(s)\",\n   \"interrupted\":[{\"cliToolId\":\"opencode\",\"instanceId\":\"opencode\",\n                   \"sessionName\":\"mcbd-opencode-uat2055oc\"}]}\n中断後 : sessionStatus=ready isGenerating=False\n```\n\nログは `opencode-interrupt-aborted-via-api` → `interrupt:sent` → `interrupt:success`。\nつまり **#2034 の `POST /session/:id/abort` 一次経路が実際に効いている**ところまで確認済みです。\n\n足りないのは **CLI 面だけ**。サブコマンド一覧に interrupt に相当するものがありません\n（`stop` はサーバの停止です）。\n\n## やること\n\n- `commandmate interrupt <worktree-id>` を追加し、`POST /api/worktrees/:id/interrupt` を呼ぶ\n- `--instance <id>` で送り先を選べるようにする（`send` / `wait` / `respond` / `capture` と同じ規約）\n- `--json` で `interrupted[]` を返す（`ls` / `capture` / `instances` と同じ additive 規約）\n- exit code を定義する（中断できたら 0 / 対象セッションが無ければ非 0）。\n  **既存コマンドの exit code 体系と衝突しない値**にすること（`src/cli/types/` の `ExitCode` を見る）\n- **`docs/user-guide/cli-operations-guide.md` を同一 PR で更新する。**\n  Epic #2055 の横断受入条件「CLI JSON 契約の変更は additive のみ（両方を同一 PR で更新）」です。\n  直前に PR #2102 でガイドの追随漏れを 3 commit ぶん埋めたところなので、繰り返さないこと\n\n## 実機確認\n\n隔離サーバで、**生成中のインスタンス**に `commandmate interrupt` を撃って\n`isGenerating` が false になることを確認してください。opencode では\n`opencode-interrupt-aborted-via-api` を通ること（Esc×2 fallback ではないこと）もログで確かめること。\n\n「生成中を捕まえる」には長いターンを投げてから短間隔でポーリングします（UAT では\n「3000 語のエッセイを書け」で 1 回目のポーリングから `running/True` が取れました）。\n\n\n## 並列ワーカーとの共有ファイル\n\n**`src/cli/types/api-responses.ts` は この Issue と #2100 の両方が触ります。**\nどちらも「既存の型を組み替えず、必要なものを**足すだけ**」にしてください。\n#2041 / #2042 / #2043 が `hooks/sources/opencode/client.ts` に対して同じやり方で\n3 本並列に足して衝突ゼロだった実績があります。\n既存フィールドの並べ替え・改名・コメントの整形はしないこと（差分が広がって機械マージが効かなくなります）。\n## 受入条件\n\n- 生成中に `commandmate interrupt <id>` で `isGenerating` が false になる（実機）\n- opencode で `opencode-interrupt-aborted-via-api` を通る（実機ログ）\n- 対象が無いときの exit code と stderr が定義され、テストで固定されている\n- `docs/user-guide/cli-operations-guide.md` が同一 commit で更新されている\n- **claude / codex の CLI 出力が不変**（この Epic の横断受入条件）\n- **変異注入で赤になることを確認する**。構造を保つ変異を使い、実施後に復元すること\n\n## 実機計測の安全規則（厳守）\n\nこの Issue は opencode 1.18.22 の実機計測を伴います。手順は\n`docs/design/opencode-server-live-verification.md` §4「再現環境（ハーネス）」にありますが、\n**§4 には CommandMate 経由の計測に効かない穴があります。**下記を先に読んでください。\n\n### ⚠️ §4 の HOME 隔離は CommandMate 経由では効きません（2026-08-26 に実害）\n\n`tmux new-session` のペインは**クライアントではなく tmux サーバのプロセス環境**を継ぎます。\n`HOME` は tmux の `update-environment` 既定リストに無いので、**CommandMate サーバに\n`HOME=<scratchpad>` を与えても、既定 tmux サーバに作られたペインは実 HOME のまま**です。\n§4 は「素の `opencode serve` にコマンドラインで `HOME=` を渡す」前提で書かれています。\n\nこれを踏んで、ユーザーの `~/.local/share/opencode/opencode.db` に書き込む事故が実際に起きました。\n\n**CommandMate 経由で計測するときの正しい手順:**\n\n1. 隔離 HOME を**持つプロセスとして**私設 tmux サーバを起こす:\n   `env HOME=\"$SP/home\" tmux -L cm<issue> new-session -d -s probe`\n2. ペインの HOME を実測して確認する:\n   `tmux -L cm<issue> send-keys -t '=probe:' -l -- \"printenv HOME > $SP/probe.txt\"` ＋ `Enter`\n3. socket と pid を取る:\n   `tmux -L cm<issue> display-message -p '#{socket_path}'` / `'#{pid}'`\n4. CommandMate dev server の env に `TMUX=\"<socket_path>,<pid>,0\"` を渡す\n   （`src/lib/tmux/tmux.ts` は socket 引数を取らないので `$TMUX` が唯一の経路）\n5. **セッション起動直後に `GET /path` の `home` が scratchpad 配下であることを確認する。**\n   外れていたら**即** `kill-session -t '=<name>:'`。これは初期チェックではなく**毎回の関門**です\n\n### 隔離 dev server の立て方\n\n- このシェルは `NODE_ENV=production` / `CM_PORT=3000` / `CM_DB_PATH=<本番>` を export 済みです。\n  **すべて明示で上書きしてください**（忘れると本番サーバ・本番 DB を掴みます）。\n- `NODE_ENV=development CM_PORT=<空きポート> CM_BIND=127.0.0.1\n  CM_DB_PATH=/Users/maenokota/.commandmate/data/cm-uat-<issue>.db\n  WORKTREE_REPOS=<計測用 repo> node_modules/.bin/tsx server.ts`\n- `CM_DB_PATH` は **homedir 配下**にすること（scratchpad は `validateDbPath()` に拒否されて起動が落ちます）。\n- **3000 番は絶対に使わない。** ポートは `47xx` 帯から選ぶ（`48xx` は他の計測と衝突した実績あり）。\n- `lsof` で空いていたことは次の瞬間の保証になりません。上の `GET /path` ゲートで毎回確かめてください。\n\n### opencode 自体について\n\n- **`HOME` ごと差し替える。** opencode は `~/.config/opencode`・`~/.local/state/opencode`・\n  `~/.local/share/opencode`（**`opencode.db` を含む**）を `$HOME` から解決し、1 ターン動かすだけで書き込みます。\n- **`auth.json` は mode 600 で複製し、検証後に削除する。**\n- **TUI のモデルピッカーを開かない**（既定モデルを書き換えます）。config でモデルを固定すること。\n\n### tmux\n\n- **`kill-server` を `-L` 無しで書かない。** 後始末は `kill-session -t '=<name>:'`（完全一致）。\n- **`TMUX_TMPDIR` を隔離手段に使わない**（`$TMUX` が設定されていると無視されます）。\n- **`bind-key` / `unbind-key` / `set-option -g` を既定サーバへ撃たない。**\n- 既定サーバにはユーザーの本番セッションが 37 本生きています。壊すと巻き添えになります。\n\n## 計測できなかった場合\n\n**推測で埋めないでください。**「計測できなかった」ことと理由を設計書と commit に書き、\nコード側は計測に依存しない範囲だけを実装してください。\n\n## 作業ルール（厳守）\n\n- **Issue 本文を書き戻さないでください。** Issue の管理はオーケストレーターが行います。\n  本文とコード／実機が食い違ったら**実測を正**とし、差異は commit メッセージと docblock に残してください。\n- **PR を作らないでください。** commit までで止めてください。\n- 作業は **単一 commit** にまとめてください。\n- 新規テストファイルは `-2101` の接尾辞をつけてください。\n- **`CHANGELOG.md` と `docs/module-reference.md` を編集しないでください**（scope 外です）。\n  代わりに次の 2 ファイルを書いてください。どちらも `dev-reports/` 配下なので commit には入りません。\n  - `dev-reports/changelog/issue-2101.md` — `CHANGELOG.md` の `## [Unreleased]` にそのまま\n    貼れる **1 エントリ**。どの節に入るかを 1 行目に HTML コメントで書く。\n    **形式は次の実例に合わせてください**（エントリは**ファイル中では 1 行**で、\n    下で折り返して見えるのは表示上の都合です）:\n\n    ```markdown\n    <!-- ### Fixed -->\n    - **fix(cli): `send` 直後の `wait` が「まだ始まっていない」を完了と読む問題を修正** (#1975): `wait` が `sessionStatus==='ready'` を完了と判定する直前に、**「このインスタンスに最後に渡されたプロンプト」と「エージェント自身が最後に報告したターン終了（`lastStopEventAt`）」を突き合わせる**ゲートを追加。`send` 直後は最新の構造化イベントが直前ターンの `stop` のままなので #1839 の `adoptTurnStart()` が何も採用せず、`turnStartedAt === null` が「決着済み」と読まれてアイドル composer をそのまま完了にしていた。\n    ```\n\n    - `- **` で始めること（集計は `grep -cE '^- \\*\\*'`）\n    - `(#2101)` は要約の**外**（`**` を閉じた後）に置くこと\n    - `<type>` は CLAUDE.md の規約語彙（`feat` / `fix` / `docs` / `refactor` / `test` / `chore` / `ci` / `style`）\n    - 1 エントリ＝1 行（折らない）\n  - `dev-reports/module-reference/issue-2101.md` — `docs/module-reference.md` の表に足す注記を\n    **行キー（`| \\`path\\` |`）ごと**に列挙する。**既存行に足すときは\n    `grep -n '^| \\`<path>\\`' docs/module-reference.md` を実行し、その出力（行番号つきの行キー）を\n    断片に書き写してから**書くこと。**0 件だった行への追記を指示しないでください**\n    （0 件なら「行が無いので追記指示は出さない」と書けばよい）。実例:\n\n    ```markdown\n    ## 既存行への追記\n    - `src/lib/foo/bar.ts` — 実在確認: `docs/module-reference.md:NNN`\n      追記内容: 「…（Issue #2101）」\n\n    ## 新規行\n    追記なし\n    ```\n- 断片が無いとリリースノートと module-reference に載りません。**実装と同じ commit の時点で書くこと。**\n- 完了したら `IMPL_COMPLETED` と出力してください。"
scope:
  allow:
  - src/cli/**
  - tests/unit/cli/**
  - tests/unit/**
  - tests/integration/**
  - docs/user-guide/cli-operations-guide.md
  - src/cli/docs/**
  deny: []
success:
  requireWorkEvidence: true
  requireScopeClean: true
